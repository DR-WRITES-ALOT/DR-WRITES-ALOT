<svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="FLOW — a deterministic transit simulation with proactive route recovery">
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a22"/><stop offset=".58" stop-color="#211842"/><stop offset="1" stop-color="#4d2859"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302866" stop-opacity=".9"/><stop offset="1" stop-color="#1a153b" stop-opacity=".9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf"/><stop offset="1" stop-color="#ffd69a"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4a9c5"/><stop offset="1" stop-color="#c7a7ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .twinkle { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.alt { animation-delay: -1.4s; }
    .twinkle.late { animation-delay: -2.7s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float.alt { animation-delay: -2.3s; }
    .float.late { animation-delay: -4.1s; }
    .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: 700px 176px; }
    .orbit.slow { animation-duration: 28s; animation-direction: reverse; }
    .reveal { animation: reveal 1.1s ease-out both; }
    .reveal.late { animation-delay: .22s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.alt { animation-delay: -1.6s; }
    @keyframes twinkle { 0%,100% { opacity:.28; transform:scale(.7); } 48% { opacity:1; transform:scale(1.22); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</defs>
  <rect x="2" y="2" width="896" height="192" rx="24" fill="url(#glass)" stroke="#514375" stroke-width="2"/>
  <path d="M3 34 Q180 2 360 28 T710 20 T897 30 V3 H3Z" fill="#c7a7ff" opacity=".06"/>
  <circle cx="87" cy="98" r="58" fill="#c7a7ff" fill-opacity=".07" stroke="#c7a7ff" stroke-opacity=".38" stroke-width="1.5"/>
  <circle cx="87" cy="98" r="70" fill="none" stroke="#c7a7ff" stroke-opacity=".18" stroke-dasharray="2 10" class="orbit"/>
  <g fill="none" stroke="#c7a7ff" stroke-width="3" opacity=".25" filter="url(#blur)"><path d="M255 118c42-62 79 52 124-4 36-45 83-31 124-69" fill="none" stroke="#c7a7ff" stroke-width="4" stroke-linecap="round"/><circle cx="250" cy="122" r="10" fill="none" stroke="#c7a7ff" stroke-width="4"/><path d="m490 42 13 4-7 12" fill="none" stroke="#c7a7ff" stroke-width="4" stroke-linecap="round"/></g>
  <g fill="none" stroke="#c7a7ff" stroke-width="3"><path d="M255 118c42-62 79 52 124-4 36-45 83-31 124-69" fill="none" stroke="#c7a7ff" stroke-width="4" stroke-linecap="round"/><circle cx="250" cy="122" r="10" fill="none" stroke="#c7a7ff" stroke-width="4"/><path d="m490 42 13 4-7 12" fill="none" stroke="#c7a7ff" stroke-width="4" stroke-linecap="round"/></g>
  <text x="34" y="38" fill="#c7a7ff" font-size="11" font-weight="700" letter-spacing="2" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">02 / WEB EXPERIMENT</text>
  <text x="190" y="57" fill="#f6f1ff" font-size="27" font-weight="700" font-family="Georgia,'Times New Roman',serif">FLOW</text>
  <text x="190" y="82" fill="#b7acce" font-size="12" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">github.com/DR-WRITES-ALOT/FLOW</text>
  <text x="190" y="111" fill="#f6f1ff" font-size="14" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">A deterministic transit simulation that watches</text>
  <text x="190" y="131" fill="#f6f1ff" font-size="14" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">connection confidence and recovers a safer route.</text>
  <rect x="190.0" y="151" width="69.7" height="22" rx="11" fill="#a9ddff" fill-opacity=".08" stroke="#a9ddff" stroke-opacity=".45"/><text x="224.8" y="166" text-anchor="middle" fill="#a9ddff" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">0 stars</text><rect x="267.7" y="151" width="69.7" height="22" rx="11" fill="#a9f3d4" fill-opacity=".08" stroke="#a9f3d4" stroke-opacity=".45"/><text x="302.5" y="166" text-anchor="middle" fill="#a9f3d4" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">Next.js</text><rect x="345.4" y="151" width="91.0" height="22" rx="11" fill="#c7a7ff" fill-opacity=".08" stroke="#c7a7ff" stroke-opacity=".45"/><text x="390.9" y="166" text-anchor="middle" fill="#c7a7ff" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">TypeScript</text><rect x="444.4" y="151" width="62.6" height="22" rx="11" fill="#ffd69a" fill-opacity=".08" stroke="#ffd69a" stroke-opacity=".45"/><text x="475.7" y="166" text-anchor="middle" fill="#ffd69a" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">Prisma</text>
  <text x="860" y="38" text-anchor="end" fill="#c7a7ff" font-size="10" font-weight="700" letter-spacing="1.5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">LIVE DEMO / ROUTES</text>
  <circle cx="838" cy="165" r="3" fill="#ffd69a" class="twinkle"/><circle cx="855" cy="153" r="2" fill="#a9ddff" class="twinkle alt"/>
</svg>
