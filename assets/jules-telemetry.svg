<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap');
      
      .main-title { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; fill: #333333; }
      .card-title { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; fill: #4A90E2; }
      
      .stat-num { font-family: 'Outfit', sans-serif; font-size: 48px; font-weight: 800; fill: #333333; }
      .stat-label { font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; fill: #7A7A7A; }
      
      .lang-label { font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; fill: #555555; }
      .lang-pct { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; fill: #333333; }
      
      .log-date { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; fill: #A0A0A0; }
      .log-action { font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; fill: #FF6B6B; }
      .log-repo { font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; fill: #333333; }
      .log-desc { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 500; fill: #7A7A7A; }
      
      .float1 { animation: floatSlow 4s ease-in-out infinite alternate; }
      .float2 { animation: floatSlow 4s ease-in-out infinite alternate-reverse; animation-delay: -2s; }
      .float3 { animation: floatSlow 4s ease-in-out infinite alternate; animation-delay: -1s; }
      
      .bar-grow { transform-origin: left; animation: growBar 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      .bar-c { fill: #5D9CEC; }
      .bar-cpp { fill: #4A90E2; }
      .bar-java { fill: #ED5565; }
      .bar-python { fill: #FFCE54; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      
      @keyframes growBar {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="496" rx="36" fill="#FDFBF7" stroke="#FFEBE6" stroke-width="4"/>

  <!-- Main Title -->
  <text x="450" y="55" class="main-title" text-anchor="middle" dominant-baseline="central">📡 Telemetry &amp; Stats</text>

  <!-- GitHub Stats Card -->
  <g transform="translate(40, 90)">
    <g class="float1">
      <rect width="380" height="180" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
      <text x="30" y="40" class="card-title" dominant-baseline="central">📊 Lifetime Stats</text>
      
      <!-- Stars -->
      <text x="70" y="100" class="stat-num" text-anchor="middle" dominant-baseline="central">14</text>
      <text x="70" y="140" class="stat-label" text-anchor="middle" dominant-baseline="central">⭐ Stars</text>
      
      <!-- Repos -->
      <text x="190" y="100" class="stat-num" text-anchor="middle" dominant-baseline="central">22</text>
      <text x="190" y="140" class="stat-label" text-anchor="middle" dominant-baseline="central">📦 Repos</text>
      
      <!-- Followers -->
      <text x="310" y="100" class="stat-num" text-anchor="middle" dominant-baseline="central">34</text>
      <text x="310" y="140" class="stat-label" text-anchor="middle" dominant-baseline="central">👥 Followers</text>
    </g>
  </g>

  <!-- Language Distribution Card -->
  <g transform="translate(440, 90)">
    <g class="float2">
      <rect width="420" height="180" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
      <text x="30" y="40" class="card-title" dominant-baseline="central">💻 Language Distribution</text>
      
      <!-- C++ Bar -->
      <g transform="translate(30, 70)">
        <text x="0" y="10" class="lang-label" dominant-baseline="central">C / C++</text>
        <rect x="100" y="2" width="220" height="16" rx="8" fill="#F0F0F0"/>
        <rect x="100" y="2" width="130" height="16" rx="8" class="bar-grow bar-cpp"/>
        <text x="335" y="10" class="lang-pct" dominant-baseline="central">42%</text>
      </g>
      
      <!-- Python Bar -->
      <g transform="translate(30, 100)">
        <text x="0" y="10" class="lang-label" dominant-baseline="central">Python</text>
        <rect x="100" y="2" width="220" height="16" rx="8" fill="#F0F0F0"/>
        <rect x="100" y="2" width="90" height="16" rx="8" class="bar-grow bar-python"/>
        <text x="335" y="10" class="lang-pct" dominant-baseline="central">28%</text>
      </g>
      
      <!-- Java Bar -->
      <g transform="translate(30, 130)">
        <text x="0" y="10" class="lang-label" dominant-baseline="central">Java</text>
        <rect x="100" y="2" width="220" height="16" rx="8" fill="#F0F0F0"/>
        <rect x="100" y="2" width="60" height="16" rx="8" class="bar-grow bar-java"/>
        <text x="335" y="10" class="lang-pct" dominant-baseline="central">15%</text>
      </g>
    </g>
  </g>

  <!-- Activity Log Card -->
  <g transform="translate(40, 290)">
    <g class="float3">
      <rect width="820" height="170" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
      <text x="30" y="40" class="card-title" dominant-baseline="central">⚡ Recent Activity Log</text>
      
      <!-- Log 1 -->
      <g transform="translate(30, 75)">
        <rect width="8" height="8" rx="4" fill="#FFB347"/>
        <text x="20" y="4" class="log-date" dominant-baseline="central">[Today]</text>
        <text x="90" y="4" class="log-action" dominant-baseline="central">push</text>
        <text x="140" y="4" class="log-repo" dominant-baseline="central">SnapHarbor</text>
        <text x="250" y="4" class="log-desc" dominant-baseline="central">Updated Jules-inspired SVG assets and layout</text>
      </g>
      
      <!-- Log 2 -->
      <g transform="translate(30, 105)">
        <rect width="8" height="8" rx="4" fill="#50E3C2"/>
        <text x="20" y="4" class="log-date" dominant-baseline="central">[Yesterday]</text>
        <text x="110" y="4" class="log-action" dominant-baseline="central">commit</text>
        <text x="175" y="4" class="log-repo" dominant-baseline="central">Unity Sandbox</text>
        <text x="295" y="4" class="log-desc" dominant-baseline="central">Tweaked jump physics and added particle trails</text>
      </g>
      
      <!-- Log 3 -->
      <g transform="translate(30, 135)">
        <rect width="8" height="8" rx="4" fill="#4A90E2"/>
        <text x="20" y="4" class="log-date" dominant-baseline="central">[Last Week]</text>
        <text x="115" y="4" class="log-action" dominant-baseline="central">push</text>
        <text x="165" y="4" class="log-repo" dominant-baseline="central">Data Structs Lab</text>
        <text x="310" y="4" class="log-desc" dominant-baseline="central">Implemented red-black tree in C++</text>
      </g>
    </g>
  </g>
</svg>
