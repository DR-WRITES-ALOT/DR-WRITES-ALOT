<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">GitHub observatory telemetry</title>
  <desc id="desc">A generated dashboard showing repository, follower, star, language, and recent activity data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211936"/><stop offset="1" stop-color="#4a2b4d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e59da9"/><stop offset=".5" stop-color="#f6d6b8"/><stop offset="1" stop-color="#c9a5df"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#0b0817" flood-opacity=".34"/></filter>
    <style>
      .frame { fill: url(#bg); stroke: #dca8d8; stroke-opacity: .4; stroke-width: 2; }
      .eyebrow { fill: #f0cbd0; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .heading { fill: #fff0df; font: 700 25px ui-rounded, "Trebuchet MS", sans-serif; }
      .card { fill: #17132b; stroke: #e4b8d0; stroke-opacity: .26; stroke-width: 1.5; }
      .stat { fill: #fff0df; font: 700 31px ui-rounded, "Trebuchet MS", sans-serif; }
      .statLabel { fill: #d7becb; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
      .section { fill: #f6d6b8; font: 700 13px ui-rounded, "Trebuchet MS", sans-serif; }
      .body { fill: #f6e9e2; font: 500 12px ui-rounded, "Trebuchet MS", sans-serif; }
      .dim { fill: #c9b1c3; font: 400 11px ui-rounded, "Trebuchet MS", sans-serif; }
      .action { fill: #e59da9; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .repo { fill: #f6d6b8; font: 600 11px ui-rounded, "Trebuchet MS", sans-serif; }
      .barBase { fill: #39284d; }
      .bar1 { fill: #e59da9; transform-origin: left; animation: grow 1.5s cubic-bezier(.2,.8,.2,1) both; }
      .bar2 { fill: #c9a5df; transform-origin: left; animation: grow 1.5s .18s cubic-bezier(.2,.8,.2,1) both; }
      .bar3 { fill: #f1c88f; transform-origin: left; animation: grow 1.5s .36s cubic-bezier(.2,.8,.2,1) both; }
      .twinkle { fill: #f6d6b8; animation: blink 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle.alt { animation-delay: -1.4s; }
      .float { animation: lift 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes blink { 0%, 100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="496" rx="26" class="frame"/>
  <path d="M48 43 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" class="twinkle"/>
  <circle cx="836" cy="43" r="2.2" class="twinkle alt"/>
  <text x="48" y="39" class="eyebrow">GITHUB OBSERVATORY · LIVE PROFILE SNAPSHOT</text>
  <text x="48" y="75" class="heading">A few numbers from the night sky</text>

  <g filter="url(#shadow)">
    <rect x="48" y="101" width="252" height="92" rx="16" class="card"/>
    <rect x="324" y="101" width="252" height="92" rx="16" class="card"/>
    <rect x="600" y="101" width="252" height="92" rx="16" class="card"/>
  </g>
  <g class="float">
    <text x="72" y="140" class="stat">{{REPOS}}</text>
    <text x="72" y="169" class="statLabel">PUBLIC REPOSITORIES</text>
    <circle cx="270" cy="124" r="7" fill="#e59da9"/>
  </g>
  <g class="float" style="animation-delay:-1.7s">
    <text x="348" y="140" class="stat">{{FOLLOWERS}}</text>
    <text x="348" y="169" class="statLabel">FOLLOWERS</text>
    <circle cx="546" cy="124" r="7" fill="#c9a5df"/>
  </g>
  <g class="float" style="animation-delay:-3.1s">
    <text x="624" y="140" class="stat">{{STARS}}</text>
    <text x="624" y="169" class="statLabel">STARS ACROSS REPOS</text>
    <circle cx="822" cy="124" r="7" fill="#f1c88f"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="218" width="390" height="238" rx="16" class="card"/>
    <rect x="462" y="218" width="390" height="238" rx="16" class="card"/>
  </g>
  <text x="72" y="251" class="section">LANGUAGE CONSTELLATION</text>
  <text x="72" y="272" class="dim">primary languages by repository</text>

  <text x="72" y="306" class="body">{{LANG1_NAME}}</text>
  <text x="408" y="306" text-anchor="end" class="body">{{LANG1_PCT}}%</text>
  <rect x="72" y="316" width="312" height="9" rx="4.5" class="barBase"/>
  <rect x="72" y="316" width="{{LANG1_WIDTH}}" height="9" rx="4.5" class="bar1"/>

  <text x="72" y="354" class="body">{{LANG2_NAME}}</text>
  <text x="408" y="354" text-anchor="end" class="body">{{LANG2_PCT}}%</text>
  <rect x="72" y="364" width="312" height="9" rx="4.5" class="barBase"/>
  <rect x="72" y="364" width="{{LANG2_WIDTH}}" height="9" rx="4.5" class="bar2"/>

  <text x="72" y="402" class="body">{{LANG3_NAME}}</text>
  <text x="408" y="402" text-anchor="end" class="body">{{LANG3_PCT}}%</text>
  <rect x="72" y="412" width="312" height="9" rx="4.5" class="barBase"/>
  <rect x="72" y="412" width="{{LANG3_WIDTH}}" height="9" rx="4.5" class="bar3"/>

  <text x="486" y="251" class="section">RECENT SIGHTINGS</text>
  <text x="486" y="272" class="dim">the latest public activity</text>
  <path d="M486 287 H828" stroke="url(#line)" stroke-opacity=".35"/>

  <g transform="translate(486 312)">
    <circle cx="5" cy="-4" r="4" fill="#e59da9"/>
    <text x="18" y="0" class="dim">[{{LOG1_DATE}}]</text>
    <text x="83" y="0" class="action">{{LOG1_TYPE}}</text>
    <text x="141" y="0" class="repo">{{LOG1_REPO}}</text>
    <text x="18" y="22" class="dim">{{LOG1_MSG}}</text>
  </g>
  <path d="M486 350 H828" stroke="#dca8d8" stroke-opacity=".16"/>
  <g transform="translate(486 375)">
    <circle cx="5" cy="-4" r="4" fill="#c9a5df"/>
    <text x="18" y="0" class="dim">[{{LOG2_DATE}}]</text>
    <text x="83" y="0" class="action">{{LOG2_TYPE}}</text>
    <text x="141" y="0" class="repo">{{LOG2_REPO}}</text>
    <text x="18" y="22" class="dim">{{LOG2_MSG}}</text>
  </g>
  <path d="M486 413 H828" stroke="#dca8d8" stroke-opacity=".16"/>
  <g transform="translate(486 438)">
    <circle cx="5" cy="-4" r="4" fill="#f1c88f"/>
    <text x="18" y="0" class="dim">[{{LOG3_DATE}}]</text>
    <text x="83" y="0" class="action">{{LOG3_TYPE}}</text>
    <text x="141" y="0" class="repo">{{LOG3_REPO}}</text>
    <text x="18" y="22" class="dim">{{LOG3_MSG}}</text>
  </g>
</svg>
