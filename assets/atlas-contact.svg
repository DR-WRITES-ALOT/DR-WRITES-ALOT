<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">Coordinates for a hello</title><desc id="desc">Contact information for Sreejith SH through GitHub and LinkedIn.</desc>
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a22"/><stop offset=".58" stop-color="#211842"/><stop offset="1" stop-color="#4d2859"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302866" stop-opacity=".9"/><stop offset="1" stop-color="#1a153b" stop-opacity=".9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf"/><stop offset="1" stop-color="#ffd69a"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4a9c5"/><stop offset="1" stop-color="#c7a7ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .twinkle { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.alt { animation-delay: -1.4s; }
    .twinkle.late { animation-delay: -2.7s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float.alt { animation-delay: -2.3s; }
    .float.late { animation-delay: -4.1s; }
    .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: 700px 176px; }
    .orbit.slow { animation-duration: 28s; animation-direction: reverse; }
    .reveal { animation: reveal 1.1s ease-out both; }
    .reveal.late { animation-delay: .22s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.alt { animation-delay: -1.6s; }
    @keyframes twinkle { 0%,100% { opacity:.28; transform:scale(.7); } 48% { opacity:1; transform:scale(1.22); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</defs>
  <rect x="2" y="2" width="896" height="206" rx="24" fill="url(#glass)" stroke="#514375" stroke-width="2"/>
  <g transform="translate(112 104)" aria-hidden="true">
    <circle r="64" fill="#f4a9c5" fill-opacity=".08" stroke="#f4a9c5" stroke-opacity=".42"/>
    <ellipse rx="84" ry="28" fill="none" stroke="#c7a7ff" stroke-opacity=".4" transform="rotate(-20)"/>
    <g class="orbit"><circle cx="84" cy="0" r="6" fill="#ffd69a"/></g>
    <path d="M-30 -15 Q0 -40 30 -15 V20 Q0 43 -30 20Z" fill="none" stroke="#f6f1ff" stroke-opacity=".85" stroke-width="2"/>
    <path d="M-29 -14 L0 8 29 -14" fill="none" stroke="#f6f1ff" stroke-opacity=".85" stroke-width="2"/>
  </g>
  <text x="220" y="52" fill="#ffd69a" font-size="10" font-weight="700" letter-spacing="2.4" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">COORDINATES FOR A HELLO</text>
  <text x="220" y="84" fill="#f6f1ff" font-size="27" font-weight="700" font-family="Georgia,'Times New Roman',serif">Bring a question. Leave a constellation.</text>
  <text x="220" y="116" fill="#b7acce" font-size="14" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">The best routes are usually the ones that begin with curiosity.</text>
  <text x="220" y="151" fill="#f4a9c5" font-size="13" font-weight="700" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">GITHUB</text><text x="306" y="151" fill="#f6f1ff" font-size="13" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">@DR-WRITES-ALOT</text>
  <text x="220" y="177" fill="#c7a7ff" font-size="13" font-weight="700" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">LINKEDIN</text><text x="306" y="177" fill="#f6f1ff" font-size="13" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">/sreejith-s-h-810803243</text>
</svg>
