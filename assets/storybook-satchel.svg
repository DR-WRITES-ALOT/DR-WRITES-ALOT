<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Sreejith's developer satchel</title>
  <desc id="desc">Animated cards grouping languages, web and UI tools, and desktop and build tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211936"/><stop offset="1" stop-color="#4b2c4e"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dca8d8" stop-opacity=".4"/><stop offset=".5" stop-color="#f6d6b8" stop-opacity=".8"/><stop offset="1" stop-color="#dca8d8" stop-opacity=".4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#0b0817" flood-opacity=".35"/></filter>
    <style>
      .frame { fill: url(#bg); stroke: url(#edge); stroke-width: 2; }
      .eyebrow { fill: #f0cbd0; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .heading { fill: #fff0df; font: 700 24px ui-rounded, "Trebuchet MS", sans-serif; }
      .card { fill: #17132b; stroke: #e4b8d0; stroke-opacity: .26; stroke-width: 1.5; }
      .cardTitle { fill: #f6d6b8; font: 700 14px ui-rounded, "Trebuchet MS", sans-serif; }
      .item { fill: #f7e9e1; font: 500 13px ui-rounded, "Trebuchet MS", sans-serif; }
      .dot { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .dot.two { animation-delay: -.8s; }
      .dot.three { animation-delay: -1.6s; }
      .float { animation: lift 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.two { animation-delay: -2s; }
      .float.three { animation-delay: -4s; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="296" rx="26" class="frame"/>
  <path d="M44 43 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#f6d6b8" class="dot"/>
  <text x="44" y="40" class="eyebrow">THE SATCHEL · INVENTORY OF CURIOSITY</text>
  <text x="44" y="74" class="heading">A few of the tools I carry</text>

  <g class="float" transform="translate(44 101)" filter="url(#shadow)">
    <rect width="254" height="157" rx="17" class="card"/>
    <circle cx="23" cy="27" r="6" fill="#e59da9" class="dot"/>
    <text x="40" y="32" class="cardTitle">LANGUAGES</text>
    <text x="22" y="65" class="item">C · C++ · Java</text>
    <text x="22" y="91" class="item">Python · TypeScript</text>
    <text x="22" y="117" class="item">JavaScript · C# · Rust</text>
    <path d="M22 136 H224" stroke="#dca8d8" stroke-opacity=".18"/>
    <text x="22" y="149" class="item" fill="#d7becb">learning by making</text>
  </g>
  <g class="float two" transform="translate(323 101)" filter="url(#shadow)">
    <rect width="254" height="157" rx="17" class="card"/>
    <circle cx="23" cy="27" r="6" fill="#c9a5df" class="dot two"/>
    <text x="40" y="32" class="cardTitle">WEB &amp; UI</text>
    <text x="22" y="65" class="item">HTML · CSS · React</text>
    <text x="22" y="91" class="item">Next.js · Tailwind CSS</text>
    <text x="22" y="117" class="item">Vite · Framer Motion</text>
    <path d="M22 136 H224" stroke="#dca8d8" stroke-opacity=".18"/>
    <text x="22" y="149" class="item">interfaces with a pulse</text>
  </g>
  <g class="float three" transform="translate(602 101)" filter="url(#shadow)">
    <rect width="254" height="157" rx="17" class="card"/>
    <circle cx="23" cy="27" r="6" fill="#f1c88f" class="dot three"/>
    <text x="40" y="32" class="cardTitle">BUILDING TOOLS</text>
    <text x="22" y="65" class="item">SQL · SQLite · Prisma</text>
    <text x="22" y="91" class="item">Tauri · Unity · Git</text>
    <text x="22" y="117" class="item">GitHub Actions</text>
    <path d="M22 136 H224" stroke="#dca8d8" stroke-opacity=".18"/>
    <text x="22" y="149" class="item">ship, learn, refine</text>
  </g>
</svg>
