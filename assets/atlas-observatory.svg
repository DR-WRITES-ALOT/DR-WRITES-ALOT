<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-labelledby="title desc">
  <title id="title">GitHub observatory</title><desc id="desc">Live profile metrics and language distribution generated from public GitHub data.</desc>
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a22"/><stop offset=".58" stop-color="#211842"/><stop offset="1" stop-color="#4d2859"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302866" stop-opacity=".9"/><stop offset="1" stop-color="#1a153b" stop-opacity=".9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf"/><stop offset="1" stop-color="#ffd69a"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4a9c5"/><stop offset="1" stop-color="#c7a7ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .twinkle { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.alt { animation-delay: -1.4s; }
    .twinkle.late { animation-delay: -2.7s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float.alt { animation-delay: -2.3s; }
    .float.late { animation-delay: -4.1s; }
    .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: 700px 176px; }
    .orbit.slow { animation-duration: 28s; animation-direction: reverse; }
    .reveal { animation: reveal 1.1s ease-out both; }
    .reveal.late { animation-delay: .22s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.alt { animation-delay: -1.6s; }
    @keyframes twinkle { 0%,100% { opacity:.28; transform:scale(.7); } 48% { opacity:1; transform:scale(1.22); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</defs>
  <rect x="2" y="2" width="896" height="282" rx="24" fill="url(#glass)" stroke="#514375" stroke-width="2"/>
  <text x="40" y="39" fill="#ffd69a" font-size="10" font-weight="700" letter-spacing="2.4" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">PROFILE OBSERVATORY</text>
  <text x="40" y="62" fill="#f6f1ff" font-size="23" font-weight="700" font-family="Georgia,'Times New Roman',serif">A few numbers from the night sky</text>
  <text x="860" y="40" text-anchor="end" fill="#b7acce" font-size="11" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">updated 2026-09-05</text>
  <g class="float" style="animation-delay:-0.0s"><rect x="40" y="73" width="184" height="76" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#f4a9c5" stroke-opacity=".28"/><text x="62" y="111" fill="#f4a9c5" font-size="30" font-weight="700" font-family="Georgia,'Times New Roman',serif">4</text><text x="62" y="131" fill="#b7acce" font-size="10" letter-spacing="1.3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">REPOSITORIES</text><circle cx="195" cy="94" r="5" fill="#f4a9c5" class="pulse"/></g><g class="float" style="animation-delay:-0.7s"><rect x="248" y="73" width="184" height="76" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#c7a7ff" stroke-opacity=".28"/><text x="270" y="111" fill="#c7a7ff" font-size="30" font-weight="700" font-family="Georgia,'Times New Roman',serif">5</text><text x="270" y="131" fill="#b7acce" font-size="10" letter-spacing="1.3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">FOLLOWERS</text><circle cx="403" cy="94" r="5" fill="#c7a7ff" class="pulse"/></g><g class="float" style="animation-delay:-1.4s"><rect x="456" y="73" width="184" height="76" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffd69a" stroke-opacity=".28"/><text x="478" y="111" fill="#ffd69a" font-size="30" font-weight="700" font-family="Georgia,'Times New Roman',serif">0</text><text x="478" y="131" fill="#b7acce" font-size="10" letter-spacing="1.3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">STARS</text><circle cx="611" cy="94" r="5" fill="#ffd69a" class="pulse"/></g><g class="float" style="animation-delay:-2.1s"><rect x="664" y="73" width="184" height="76" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#a9ddff" stroke-opacity=".28"/><text x="686" y="111" fill="#a9ddff" font-size="30" font-weight="700" font-family="Georgia,'Times New Roman',serif">8</text><text x="686" y="131" fill="#b7acce" font-size="10" letter-spacing="1.3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">ACTIVE DAYS</text><circle cx="819" cy="94" r="5" fill="#a9ddff" class="pulse"/></g>
  <path d="M40 164 H860" stroke="#514375" stroke-opacity=".65"/>
  <text x="40" y="176" fill="#b7acce" font-size="10" letter-spacing="1.4" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">LANGUAGE CONSTELLATION · BY CODE VOLUME</text>
  <text x="40" y="195" fill="#f6f1ff" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">TypeScript</text><rect x="135" y="183" width="360" height="10" rx="5" fill="#171333"/><rect x="135" y="183" width="306" height="10" rx="5" fill="url(#rose)"/><text x="510" y="193" fill="#a9ddff" font-size="11" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">85%</text><text x="40" y="218" fill="#f6f1ff" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">Rust</text><rect x="135" y="206" width="360" height="10" rx="5" fill="#171333"/><rect x="135" y="206" width="40" height="10" rx="5" fill="url(#rose)"/><text x="510" y="216" fill="#a9ddff" font-size="11" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">11%</text><text x="40" y="241" fill="#f6f1ff" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">Python</text><rect x="135" y="229" width="360" height="10" rx="5" fill="#171333"/><rect x="135" y="229" width="7" height="10" rx="5" fill="url(#rose)"/><text x="510" y="239" fill="#a9ddff" font-size="11" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">2%</text><text x="40" y="264" fill="#f6f1ff" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">HTML</text><rect x="135" y="252" width="360" height="10" rx="5" fill="#171333"/><rect x="135" y="252" width="4" height="10" rx="5" fill="url(#rose)"/><text x="510" y="262" fill="#a9ddff" font-size="11" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">1%</text>
  <circle cx="820" cy="238" r="32" fill="none" stroke="#c7a7ff" stroke-opacity=".18"/><circle cx="820" cy="238" r="5" fill="#ffd69a" class="twinkle"/><path d="M786 250 Q820 218 854 250" fill="none" stroke="#f4a9c5" stroke-opacity=".35"/>
</svg>
