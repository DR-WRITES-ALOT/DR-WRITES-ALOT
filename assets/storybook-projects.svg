<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Selected projects</title>
  <desc id="desc">Animated storybook cards for SnapHarbor, FLOW, and Rapid Response Drone Mapper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211936"/><stop offset="1" stop-color="#4a2b4d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6d6b8"/><stop offset="1" stop-color="#e59da9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#0b0817" flood-opacity=".38"/></filter>
    <style>
      .frame { fill: url(#bg); stroke: #dca8d8; stroke-opacity: .38; stroke-width: 2; }
      .eyebrow { fill: #f0cbd0; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .heading { fill: #fff0df; font: 700 24px ui-rounded, "Trebuchet MS", sans-serif; }
      .card { fill: #17132b; stroke: #e4b8d0; stroke-opacity: .27; stroke-width: 1.5; }
      .cardLabel { fill: #f6d6b8; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
      .name { fill: #fff0df; font: 700 22px ui-rounded, "Trebuchet MS", sans-serif; }
      .copy { fill: #ead8dc; font: 400 12px ui-rounded, "Trebuchet MS", sans-serif; }
      .tag { fill: #2f2145; stroke: #dca8d8; stroke-opacity: .46; }
      .tagText { fill: #f5dfe0; font: 600 10px ui-rounded, "Trebuchet MS", sans-serif; }
      .float { animation: lift 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.two { animation-delay: -2s; }
      .float.three { animation-delay: -4s; }
      .spark { fill: #f6d6b8; animation: blink 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spark.alt { animation-delay: -1.8s; }
      @keyframes lift { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(.5deg); } }
      @keyframes blink { 0%, 100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="426" rx="26" class="frame"/>
  <path d="M44 43 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" class="spark"/>
  <path d="M842 50 l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" class="spark alt"/>
  <text x="44" y="40" class="eyebrow">SELECTED PAGES · OPEN FOR EXPLORATION</text>
  <text x="44" y="75" class="heading">Projects from the workshop</text>

  <g class="float" transform="translate(31 103)" filter="url(#shadow)">
    <rect width="264" height="285" rx="18" class="card"/>
    <circle cx="25" cy="27" r="7" fill="#e59da9"/>
    <text x="43" y="31" class="cardLabel">DESKTOP TOOL · V1.0</text>
    <text x="20" y="75" class="name">SnapHarbor</text>
    <text x="20" y="108" class="copy">A calm, local-first media vault</text>
    <text x="20" y="128" class="copy">with smart dedupe, device sync,</text>
    <text x="20" y="148" class="copy">timeline galleries, and automation.</text>
    <path d="M20 174 H244" stroke="#dca8d8" stroke-opacity=".2"/>
    <rect x="20" y="196" width="80" height="24" rx="12" class="tag"/><text x="60" y="212" text-anchor="middle" class="tagText">Rust</text>
    <rect x="109" y="196" width="72" height="24" rx="12" class="tag"/><text x="145" y="212" text-anchor="middle" class="tagText">Tauri</text>
    <rect x="190" y="196" width="54" height="24" rx="12" class="tag"/><text x="217" y="212" text-anchor="middle" class="tagText">React</text>
    <text x="20" y="257" class="copy" fill="#f6d6b8">⚓ local by design</text>
  </g>

  <g class="float two" transform="translate(318 103)" filter="url(#shadow)">
    <rect width="264" height="285" rx="18" class="card"/>
    <circle cx="25" cy="27" r="7" fill="#c9a5df"/>
    <text x="43" y="31" class="cardLabel">SIMULATION · ROUTE RECOVERY</text>
    <text x="20" y="75" class="name">FLOW</text>
    <text x="20" y="108" class="copy">A transit simulation that watches</text>
    <text x="20" y="128" class="copy">connection confidence and finds</text>
    <text x="20" y="148" class="copy">a safer route before it is too late.</text>
    <path d="M20 174 H244" stroke="#dca8d8" stroke-opacity=".2"/>
    <rect x="20" y="196" width="92" height="24" rx="12" class="tag"/><text x="66" y="212" text-anchor="middle" class="tagText">Next.js</text>
    <rect x="121" y="196" width="92" height="24" rx="12" class="tag"/><text x="167" y="212" text-anchor="middle" class="tagText">TypeScript</text>
    <text x="20" y="257" class="copy" fill="#f6d6b8">🧭 never late, on purpose</text>
  </g>

  <g class="float three" transform="translate(605 103)" filter="url(#shadow)">
    <rect width="264" height="285" rx="18" class="card"/>
    <circle cx="25" cy="27" r="7" fill="#f1c88f"/>
    <text x="43" y="31" class="cardLabel">HACKATHON · COMPUTER VISION</text>
    <text x="20" y="75" class="name">Drone Mapper</text>
    <text x="20" y="108" class="copy">Turns aerial images into rapid</text>
    <text x="20" y="128" class="copy">damage assessments, severity</text>
    <text x="20" y="148" class="copy">scores, and an incident map.</text>
    <path d="M20 174 H244" stroke="#dca8d8" stroke-opacity=".2"/>
    <rect x="20" y="196" width="70" height="24" rx="12" class="tag"/><text x="55" y="212" text-anchor="middle" class="tagText">Python</text>
    <rect x="99" y="196" width="84" height="24" rx="12" class="tag"/><text x="141" y="212" text-anchor="middle" class="tagText">Streamlit</text>
    <text x="20" y="257" class="copy" fill="#f6d6b8">🚁 built for a hackathon</text>
  </g>
</svg>
