<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Current orbit</title><desc id="desc">Current focus, next milestone, and wandering experiments.</desc>
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a22"/><stop offset=".58" stop-color="#211842"/><stop offset="1" stop-color="#4d2859"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302866" stop-opacity=".9"/><stop offset="1" stop-color="#1a153b" stop-opacity=".9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf"/><stop offset="1" stop-color="#ffd69a"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4a9c5"/><stop offset="1" stop-color="#c7a7ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .twinkle { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.alt { animation-delay: -1.4s; }
    .twinkle.late { animation-delay: -2.7s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float.alt { animation-delay: -2.3s; }
    .float.late { animation-delay: -4.1s; }
    .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: 700px 176px; }
    .orbit.slow { animation-duration: 28s; animation-direction: reverse; }
    .reveal { animation: reveal 1.1s ease-out both; }
    .reveal.late { animation-delay: .22s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.alt { animation-delay: -1.6s; }
    @keyframes twinkle { 0%,100% { opacity:.28; transform:scale(.7); } 48% { opacity:1; transform:scale(1.22); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</defs>
  <rect x="2" y="2" width="896" height="216" rx="24" fill="url(#glass)" stroke="#514375" stroke-width="2"/>
  <circle cx="850" cy="26" r="80" fill="#c7a7ff" opacity=".09" filter="url(#blur)"/>
  <text x="38" y="39" fill="#ffd69a" font-size="10" font-weight="700" letter-spacing="2.4" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">CURRENT ORBIT</text>
  <text x="38" y="65" fill="#f6f1ff" font-size="23" font-weight="700" font-family="Georgia,'Times New Roman',serif">What is moving through the workshop</text>
  <g class="float" style="animation-delay:-0.1s">
    <rect x="38" y="84" width="264" height="105" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#f4a9c5" stroke-opacity=".35"/>
    <circle cx="62" cy="111" r="6" fill="#f4a9c5" class="pulse"/>
    <text x="79" y="116" fill="#f4a9c5" font-size="10" font-weight="700" letter-spacing="1.5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">NOW</text>
    <text x="58" y="149" fill="#f6f1ff" font-size="20" font-weight="700" font-family="Georgia,'Times New Roman',serif">SnapHarbor</text>
    <text x="58" y="171" fill="#b7acce" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">local-first media tools</text>
  </g><g class="float" style="animation-delay:-1.1s">
    <rect x="318" y="84" width="264" height="105" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#c7a7ff" stroke-opacity=".35"/>
    <circle cx="342" cy="111" r="6" fill="#c7a7ff" class="pulse"/>
    <text x="359" y="116" fill="#c7a7ff" font-size="10" font-weight="700" letter-spacing="1.5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">NEXT</text>
    <text x="338" y="149" fill="#f6f1ff" font-size="20" font-weight="700" font-family="Georgia,'Times New Roman',serif">Unity mechanics</text>
    <text x="338" y="171" fill="#b7acce" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">loops · physics · C#</text>
  </g><g class="float" style="animation-delay:-2.0s">
    <rect x="598" y="84" width="264" height="105" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#ffd69a" stroke-opacity=".35"/>
    <circle cx="622" cy="111" r="6" fill="#ffd69a" class="pulse"/>
    <text x="639" y="116" fill="#ffd69a" font-size="10" font-weight="700" letter-spacing="1.5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">WANDERING</text>
    <text x="618" y="149" fill="#f6f1ff" font-size="20" font-weight="700" font-family="Georgia,'Times New Roman',serif">FLOW</text>
    <text x="618" y="171" fill="#b7acce" font-size="12" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">simulations · route recovery</text>
  </g>
</svg>
