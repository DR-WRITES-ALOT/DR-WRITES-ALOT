<svg width="840" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .title { font-family: 'Courier New', Courier, monospace; font-size: 22px; font-weight: bold; fill: #00FF66; filter: drop-shadow(0 0 5px #00FF66); }
      .label { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #8b949e; text-transform: uppercase; }
      .val { font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: bold; fill: #00FFFF; filter: drop-shadow(0 0 5px #00FFFF); }

      @keyframes loadBar { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
      .progress { transform-origin: left center; animation: loadBar 1.5s ease-out forwards; }
      .progress-bg { fill: #1f2937; }
    </style>
  </defs>

  <rect width="840" height="200" rx="10" class="bg" stroke="#1f2937" stroke-width="2"/>

  <text x="30" y="45" class="title">SYSTEM_TELEMETRY.log</text>
  <line x1="30" y1="55" x2="810" y2="55" stroke="#1f2937" stroke-width="2"/>

  <!-- Stats Grid -->
  <g transform="translate(70, 110)">
    <text class="val" x="0" y="0">0</text>
    <text class="label" x="0" y="25">TOTAL STARS</text>

    <text class="val" x="220" y="0">0</text>
    <text class="label" x="220" y="25">COMMITS</text>

    <text class="val" x="420" y="0">0</text>
    <text class="label" x="420" y="25">REPOSITORIES</text>

    <text class="val" x="620" y="0">0</text>
    <text class="label" x="620" y="25">FOLLOWERS</text>
  </g>

  <!-- Language Progress Bar -->
  <g transform="translate(70, 175)">
    <text class="label" x="0" y="3">STACK DISTRIBUTION</text>
    <rect class="progress-bg" x="180" y="-12" width="580" height="20" />
    <rect fill="#00FF66" x="180" y="-12" width="232.0" height="20" filter="drop-shadow(0 0 5px #00FF66)" class="progress"/>
    <rect fill="#00cc55" x="412.0" y="-12" width="174.0" height="20" filter="drop-shadow(0 0 5px #00cc55)" class="progress"/>
    <rect fill="#009944" x="586.0" y="-12" width="116.0" height="20" filter="drop-shadow(0 0 5px #009944)" class="progress"/>
    <rect fill="#006622" x="702.0" y="-12" width="58.0" height="20" filter="drop-shadow(0 0 5px #006622)" class="progress"/>

  </g>
</svg>