<svg fill="none" viewBox="0 0 900 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .container {
          width: 100%;
          height: 360px;
          background: #090a10;
          position: relative;
          overflow: hidden;
          font-family: 'Outfit', sans-serif;
          border-radius: 24px;
          border: 2px solid rgba(255, 46, 147, 0.35);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 46, 147, 0.15);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 48px;
        }

        /* Ambient Candy Glows */
        .glow-1 {
          position: absolute;
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(255, 46, 147, 0.35) 0%, rgba(255, 46, 147, 0) 70%);
          top: -80px;
          left: -60px;
          filter: blur(40px);
          animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        .glow-2 {
          position: absolute;
          width: 340px;
          height: 340px;
          background: radial-gradient(circle, rgba(0, 240, 255, 0.28) 0%, rgba(0, 240, 255, 0) 70%);
          bottom: -90px;
          right: 20px;
          filter: blur(45px);
          animation: pulseGlow 7s ease-in-out infinite alternate-reverse;
        }

        .glow-3 {
          position: absolute;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(255, 230, 0, 0.2) 0%, rgba(255, 230, 0, 0) 70%);
          top: 30px;
          right: 320px;
          filter: blur(50px);
          animation: floatSlow 8s ease-in-out infinite alternate;
        }

        /* Grid Background */
        .grid-pattern {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 28px 28px;
          mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
          pointer-events: none;
        }

        /* Floating Sparkles */
        .sparkle {
          position: absolute;
          animation: sparkleAnim 3s ease-in-out infinite;
        }
        .s1 { top: 38px; left: 420px; animation-delay: 0s; font-size: 20px; color: #ff2e93; }
        .s2 { bottom: 50px; left: 80px; animation-delay: 1.2s; font-size: 18px; color: #00f0ff; }
        .s3 { top: 70px; right: 80px; animation-delay: 0.7s; font-size: 22px; color: #ffe600; }
        .s4 { bottom: 85px; right: 380px; animation-delay: 1.8s; font-size: 16px; color: #ff7a00; }

        /* Left Content */
        .content {
          position: relative;
          z-index: 10;
          max-width: 530px;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(255, 46, 147, 0.12);
          border: 1px solid rgba(255, 46, 147, 0.4);
          padding: 6px 14px;
          border-radius: 999px;
          color: #ff75ba;
          font-size: 12.5px;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: uppercase;
          margin-bottom: 12px;
          backdrop-filter: blur(8px);
          box-shadow: 0 4px 15px rgba(255, 46, 147, 0.2);
        }

        .status-dot {
          width: 8px;
          height: 8px;
          background: #00ff88;
          border-radius: 50%;
          box-shadow: 0 0 10px #00ff88;
          animation: blink 1.6s infinite;
        }

        .title-name {
          font-size: 42px;
          font-weight: 900;
          line-height: 1.1;
          color: #ffffff;
          letter-spacing: -0.5px;
          margin-bottom: 6px;
        }

        .candy-gradient-text {
          background: linear-gradient(135deg, #ff2e93 0%, #ff7a00 35%, #ffe600 70%, #00f0ff 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 2px 10px rgba(255, 46, 147, 0.3));
        }

        .subtitle {
          font-family: 'JetBrains Mono', monospace;
          font-size: 14.5px;
          font-weight: 700;
          color: #00f0ff;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .handle-tag {
          background: rgba(0, 240, 255, 0.12);
          border: 1px solid rgba(0, 240, 255, 0.3);
          color: #00f0ff;
          padding: 2px 8px;
          border-radius: 6px;
          font-size: 13px;
        }

        .desc {
          font-size: 14px;
          color: #b8c1ec;
          line-height: 1.55;
          margin-bottom: 18px;
        }

        .tags-row {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }

        .tag-chip {
          display: flex;
          align-items: center;
          gap: 6px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.12);
          padding: 4px 10px;
          border-radius: 8px;
          font-size: 11.5px;
          font-weight: 600;
          color: #f1f5f9;
        }

        .tag-chip.pink { border-color: rgba(255, 46, 147, 0.5); background: rgba(255, 46, 147, 0.15); color: #ff94c7; }
        .tag-chip.orange { border-color: rgba(255, 122, 0, 0.5); background: rgba(255, 122, 0, 0.15); color: #ffb066; }
        .tag-chip.cyan { border-color: rgba(0, 240, 255, 0.5); background: rgba(0, 240, 255, 0.15); color: #70f7ff; }
        .tag-chip.purple { border-color: rgba(121, 40, 202, 0.5); background: rgba(121, 40, 202, 0.15); color: #c488ff; }

        /* Right Card */
        .graphic-side {
          position: relative;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .arcade-card {
          width: 240px;
          height: 240px;
          background: linear-gradient(145deg, rgba(26, 28, 45, 0.85), rgba(13, 14, 24, 0.95));
          border-radius: 22px;
          border: 2px solid rgba(255, 46, 147, 0.3);
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.08);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          backdrop-filter: blur(12px);
          animation: hoverFloat 5s ease-in-out infinite;
        }

        .arcade-screen {
          width: 190px;
          height: 110px;
          background: #05060a;
          border-radius: 12px;
          border: 1.5px solid rgba(0, 240, 255, 0.4);
          box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 6px;
          margin-bottom: 14px;
          position: relative;
          overflow: hidden;
        }

        .screen-line {
          position: absolute;
          width: 100%;
          height: 2px;
          background: rgba(0, 240, 255, 0.3);
          top: 0;
          animation: scanline 2.5s linear infinite;
        }

        .controller-icon {
          font-size: 34px;
          filter: drop-shadow(0 0 12px #ff2e93);
          animation: pulseScale 2s ease-in-out infinite;
        }

        .screen-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10.5px;
          font-weight: 700;
          color: #00f0ff;
          letter-spacing: 0.5px;
        }

        .arcade-controls {
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 180px;
          padding: 0 6px;
        }

        .d-pad {
          width: 28px;
          height: 28px;
          position: relative;
        }
        .d-pad-h {
          position: absolute;
          width: 28px;
          height: 9px;
          top: 9.5px;
          background: #2a2e45;
          border-radius: 3px;
        }
        .d-pad-v {
          position: absolute;
          height: 28px;
          width: 9px;
          left: 9.5px;
          background: #2a2e45;
          border-radius: 3px;
        }

        .action-btns {
          display: flex;
          gap: 7px;
        }

        .btn-candy {
          width: 20px;
          height: 20px;
          border-radius: 50%;
          box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }
        .b-pink { background: #ff2e93; box-shadow: 0 0 8px #ff2e93; }
        .b-yellow { background: #ffe600; box-shadow: 0 0 8px #ffe600; }
        .b-cyan { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }

        .level-badge {
          position: absolute;
          bottom: -11px;
          right: -8px;
          background: linear-gradient(135deg, #ff2e93, #ff7a00);
          color: #fff;
          font-weight: 800;
          font-size: 10px;
          padding: 4px 10px;
          border-radius: 20px;
          box-shadow: 0 6px 16px rgba(255, 46, 147, 0.4);
          letter-spacing: 0.5px;
          border: 2px solid #090a10;
        }

        @keyframes pulseGlow {
          0% { transform: scale(1); opacity: 0.7; }
          100% { transform: scale(1.25); opacity: 1; }
        }

        @keyframes floatSlow {
          0% { transform: translate(0, 0); }
          100% { transform: translate(-20px, 20px); }
        }

        @keyframes hoverFloat {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-8px) rotate(1deg); }
        }

        @keyframes pulseScale {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.1); }
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }

        @keyframes sparkleAnim {
          0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
          50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
        }

        @keyframes scanline {
          0% { top: 0; opacity: 0.8; }
          100% { top: 100%; opacity: 0.1; }
        }
      </style>

      <div class="container">
        <!-- Glows -->
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>
        <div class="grid-pattern"></div>

        <!-- Sparkles -->
        <div class="sparkle s1">✦</div>
        <div class="sparkle s2">★</div>
        <div class="sparkle s3">✦</div>
        <div class="sparkle s4">★</div>

        <!-- Left Information -->
        <div class="content">
          <div class="badge-pill">
            <span class="status-dot"></span>
            <span>B.Tech CSE @ VIT ('29) • Web Dev</span>
          </div>

          <h1 class="title-name">
            Hey, I'm <span class="candy-gradient-text">Sreejith S H</span>
          </h1>

          <div class="subtitle">
            <span>&lt;Learning_Mode&gt;</span>
            <span class="handle-tag">@DR_WRITES_ALOT</span>
          </div>

          <p class="desc">
            Computer Science student at VIT ('29 Batch) &amp; aspiring web developer. Writing code in C/C++, Java &amp; Python, building fun projects like SnapHarbor! ⚓✨
          </p>

          <div class="tags-row">
            <div class="tag-chip pink">🎓 VIT '29</div>
            <div class="tag-chip cyan">🌐 Web Dev</div>
            <div class="tag-chip orange">⚓ SnapHarbor</div>
            <div class="tag-chip purple">🐍 Python &amp; SQL</div>
          </div>
        </div>

        <!-- Right Graphic -->
        <div class="graphic-side">
          <div class="arcade-card">
            <div class="arcade-screen">
              <div class="screen-line"></div>
              <div class="controller-icon">💻</div>
              <div class="screen-text">STATUS : LEARNING</div>
            </div>
            <div class="arcade-controls">
              <div class="d-pad">
                <div class="d-pad-h"></div>
                <div class="d-pad-v"></div>
              </div>
              <div class="action-btns">
                <div class="btn-candy b-pink"></div>
                <div class="btn-candy b-yellow"></div>
                <div class="btn-candy b-cyan"></div>
              </div>
            </div>
            <div class="level-badge">VIT '29 BATCH 🌱</div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
