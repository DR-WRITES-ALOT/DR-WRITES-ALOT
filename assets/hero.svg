  <path d="M30 300 H830" stroke="url(#horizon)" stroke-opacity=".5" stroke-dasharray="3 8"/>
  <path d="M14 16 V8 H26 M846 350 V362 H834" fill="none" stroke="#8cf7d6" stroke-opacity=".45"/>
