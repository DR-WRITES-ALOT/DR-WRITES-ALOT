      .title { font-family: 'Courier New', Courier, monospace; font-size: 64px; font-weight: bold; fill: #00FF66; filter: drop-shadow(0 0 10px #00FF66) drop-shadow(0 0 20px #00FF66); }
      .sub { font-family: 'Courier New', Courier, monospace; font-size: 16px; fill: #8b949e; }

      @keyframes float {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(100px); opacity: 0; }
      }
      .float-char { font-family: monospace; font-size: 14px; font-weight: bold; opacity: 0; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor-block { animation: blink 1s step-end infinite; fill: #00FF66; filter: drop-shadow(0 0 10px #00FF66); }

      /* Base reveal animation for subtitle */
      @keyframes reveal { 0% { opacity: 0; } 100% { opacity: 1; } }
      .reveal { animation: reveal 0.1s forwards; opacity: 0; }
