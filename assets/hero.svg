<svg xmlns="http://www.w3.org/2000/svg" width="860" height="378" viewBox="0 0 860 378" role="img" aria-labelledby="title desc">
  <title id="title">Sreejith SH — dreamy terminal profile</title>
  <desc id="desc">A moonlit terminal window introducing Sreejith SH, a VIT computer science student and aspiring web developer.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="3" height="4" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#8cf7d6" opacity=".035"/>
    </pattern>
  </defs>
  <defs><linearGradient id="horizon" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8cf7d6" stop-opacity="0"/><stop offset=".5" stop-color="#c9a8ff" stop-opacity=".3"/><stop offset="1" stop-color="#8cf7d6" stop-opacity="0"/></linearGradient></defs>
    <rect x="1" y="1" width="858" height="376" rx="12" fill="#090d1b" stroke="#273552" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="40" rx="12" fill="#10162a"/>
  <rect x="1" y="28" width="858" height="13" fill="#10162a"/>
  <line x1="1" y1="41" x2="859" y2="41" stroke="#273552" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="6" fill="#ff7898" opacity=".86"/>
  <circle cx="44" cy="21" r="6" fill="#ffd166" opacity=".86"/>
  <circle cx="64" cy="21" r="6" fill="#78f3b0" opacity=".86"/>
  <text x="78" y="26" font-size="13" fill="#71809e" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">sreejith@vit: ~/profile — zsh</text>

  <circle cx="714" cy="113" r="135" fill="#c9a8ff" opacity=".08" filter="url(#glow)"/>
  <circle cx="775" cy="98" r="64" fill="#ffd6a7" opacity=".09" filter="url(#glow)"/>
  <rect x="1" y="42" width="858" height="86" fill="url(#horizon)" opacity=".34"/>
  <rect x="2" y="42" width="856" height="334" fill="url(#scanlines)"/>

  <!-- a single boot-time scan, followed by a quiet blinking cursor -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="-80 0;860 0" dur="2.5s" begin=".1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.08;.85;1" dur="2.5s" begin=".1s" fill="freeze"/>
    <rect x="0" y="42" width="58" height="334" fill="url(#horizon)"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="0.15s" fill="freeze"/>
    <text x="30" y="88" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6" font-weight="700">sreejith@vit</tspan><tspan fill="#71809e">:</tspan><tspan fill="#c9a8ff">~</tspan><tspan fill="#71809e">$ </tspan><tspan fill="#edf2ff">./whoami --proof</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="0.55s" fill="freeze"/>
    <text x="30" y="118" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#71809e">[*] </tspan><tspan fill="#edf2ff">resolving identity </tspan><tspan fill="#71809e">·········· </tspan><tspan fill="#8cf7d6" font-weight="700">ok</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="0.95s" fill="freeze"/>
    <text x="30" y="148" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6">role  </tspan><tspan fill="#71809e"> : </tspan><tspan fill="#edf2ff">computer science student · web developer</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="1.35s" fill="freeze"/>
    <text x="30" y="178" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6">base  </tspan><tspan fill="#71809e"> : </tspan><tspan fill="#edf2ff">VIT &#x27;29 · learning in public</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="1.75s" fill="freeze"/>
    <text x="30" y="208" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6">mode  </tspan><tspan fill="#71809e"> : </tspan><tspan fill="#edf2ff">local-first tools · web experiments · side quests</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="2.15s" fill="freeze"/>
    <text x="30" y="238" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6">proof </tspan><tspan fill="#71809e"> : </tspan><tspan fill="#edf2ff">SnapHarbor · FLOW · Unity</tspan></text>
  </g><g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".42s" begin="2.55s" fill="freeze"/>
    <text x="30" y="268" font-size="17" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#8cf7d6">[+] </tspan><tspan fill="#8cf7d6" font-weight="700">profile loaded</tspan><tspan fill="#71809e">  </tspan><tspan fill="#8ec9ff">4 repos · 5 followers · 0★</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".55s" begin="3.05s" fill="freeze"/>
    <text x="30" y="337" font-size="40" font-weight="700" fill="#8cf7d6" filter="url(#glow)" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">Sreejith SH</text>
    <text x="30" y="337" font-size="40" font-weight="700" fill="#8cf7d6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">Sreejith SH<tspan fill="#8cf7d6"> █<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.49;.5;1" dur="1.05s" begin="3.4s" repeatCount="indefinite"/></tspan></text>
    <text x="830" y="337" text-anchor="end" font-size="14" fill="#71809e" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">// DR-WRITES-ALOT · page 01</text>
