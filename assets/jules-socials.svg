<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&amp;display=swap');
      
      .text { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; fill: #333333; }
      .text-linkedin { fill: #4A90E2; }
      .text-email { fill: #FF6B6B; }
      
      .btn1 { animation: pulseBtn 3s infinite alternate; }
      .btn2 { animation: pulseBtn 3s infinite alternate; animation-delay: 0.5s; }
      .btn3 { animation: pulseBtn 3s infinite alternate; animation-delay: 1s; }
      
      @keyframes pulseBtn {
        0% { transform: scale(1) translateY(0px); }
        100% { transform: scale(1.05) translateY(-5px); }
      }
    </style>
    <filter id="shadow-btn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- LinkedIn -->
  <g transform="translate(180, 50)">
    <g class="btn1">
      <rect width="160" height="56" rx="28" fill="#FFFFFF" stroke="#D4E9FF" stroke-width="3" filter="url(#shadow-btn)"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="22" dominant-baseline="central">💼</text>
      <text x="65" y="34" class="text text-linkedin" dominant-baseline="central">LinkedIn</text>
    </g>
  </g>

  <!-- Email -->
  <g transform="translate(370, 50)">
    <g class="btn2">
      <rect width="160" height="56" rx="28" fill="#FFFFFF" stroke="#FFE0D4" stroke-width="3" filter="url(#shadow-btn)"/>
      <text x="25" y="34" font-family="Arial, sans-serif" font-size="22" dominant-baseline="central">✉️</text>
      <text x="65" y="34" class="text text-email" dominant-baseline="central">Email Me</text>
    </g>
  </g>

  <!-- GitHub -->
  <g transform="translate(560, 50)">
    <g class="btn3">
      <rect width="150" height="56" rx="28" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="3" filter="url(#shadow-btn)"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="22" dominant-baseline="central">🐙</text>
      <text x="65" y="34" class="text" dominant-baseline="central">GitHub</text>
    </g>
  </g>
</svg>
