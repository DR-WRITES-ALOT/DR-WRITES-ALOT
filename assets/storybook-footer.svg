<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">The end of the chapter</title>
  <desc id="desc">A dreamy animated footer inviting the reader to return for the next chapter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17132b"/><stop offset=".55" stop-color="#302044"/><stop offset="1" stop-color="#5c385c"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dca8d8" stop-opacity="0"/><stop offset=".5" stop-color="#f6d6b8"/><stop offset="1" stop-color="#dca8d8" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .frame { fill: url(#bg); stroke: #dca8d8; stroke-opacity: .45; stroke-width: 2; }
      .small { fill: #f0cbd0; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .title { fill: #fff0df; font: 700 29px ui-rounded, "Trebuchet MS", sans-serif; }
      .copy { fill: #f6e0df; font: 400 14px ui-rounded, "Trebuchet MS", sans-serif; }
      .star { fill: #f6d6b8; filter: url(#glow); animation: twinkle 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star.alt { animation-delay: -1.3s; }
      .star.late { animation-delay: -2.2s; }
      .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="186" rx="25" class="frame"/>
  <path d="M42 92 H858" stroke="url(#line)" stroke-width="1.5"/>
  <path d="M42 92 H858" stroke="#f6d6b8" stroke-opacity=".22" stroke-dasharray="3 12"/>
  <path d="M104 68 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" class="star"/>
  <path d="M796 56 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" class="star alt"/>
  <circle cx="165" cy="120" r="2" class="star late"/>
  <circle cx="744" cy="124" r="2" class="star"/>
  <g class="float">
    <circle cx="450" cy="45" r="15" fill="#fff0cf" opacity=".9" filter="url(#glow)"/>
    <circle cx="458" cy="40" r="16" fill="#302044"/>
  </g>
  <text x="450" y="126" text-anchor="middle" class="small">END OF THIS CHAPTER</text>
  <text x="450" y="157" text-anchor="middle" class="title">Come back for the next little thing.</text>
  <text x="450" y="177" text-anchor="middle" class="copy">There is always another idea waiting in the margins.</text>
</svg>
