<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Sreejith's current chapter</title>
  <desc id="desc">Three dreamy cards showing the current focus, next milestone, and side quest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#231b39"/><stop offset="1" stop-color="#3a264c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6d6b8"/><stop offset="1" stop-color="#edb3c6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b0817" flood-opacity=".34"/></filter>
    <style>
      .frame { fill: url(#bg); stroke: #dca8d8; stroke-opacity: .35; stroke-width: 2; }
      .label { fill: #f0cbd0; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .heading { fill: #fff0df; font: 700 23px ui-rounded, "Trebuchet MS", sans-serif; }
      .card { fill: #17132b; stroke: #dca8d8; stroke-opacity: .24; stroke-width: 1.5; }
      .cardTitle { fill: #f6d6b8; font: 700 14px ui-rounded, "Trebuchet MS", sans-serif; }
      .cardText { fill: #f6e9e2; font: 400 13px ui-rounded, "Trebuchet MS", sans-serif; }
      .cardText.dim { fill: #d7becb; font-size: 11px; }
      .float { animation: lift 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.two { animation-delay: -1.7s; }
      .float.three { animation-delay: -3.2s; }
      .glint { animation: glint 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes glint { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="226" rx="25" class="frame"/>
  <circle cx="820" cy="38" r="75" fill="#dca8d8" opacity=".08"/>
  <path d="M44 42 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#f6d6b8" class="glint"/>
  <text x="44" y="39" class="label">CURRENT CHAPTER</text>
  <text x="44" y="73" class="heading">Build · learn · repeat</text>

  <g class="float" transform="translate(44 97)" filter="url(#shadow)">
    <rect width="252" height="100" rx="16" class="card"/>
    <circle cx="25" cy="26" r="7" fill="#e59da9"/>
    <text x="43" y="31" class="cardTitle">RIGHT NOW</text>
    <text x="20" y="59" class="cardText">Shipping thoughtful details</text>
    <text x="20" y="79" class="cardText dim">SnapHarbor · local-first tools</text>
  </g>
  <g class="float two" transform="translate(324 97)" filter="url(#shadow)">
    <rect width="252" height="100" rx="16" class="card"/>
    <circle cx="25" cy="26" r="7" fill="#c9a5df"/>
    <text x="43" y="31" class="cardTitle">NEXT MILESTONE</text>
    <text x="20" y="59" class="cardText">Deeper Unity mechanics</text>
    <text x="20" y="79" class="cardText dim">Game loops · physics · C#</text>
  </g>
  <g class="float three" transform="translate(604 97)" filter="url(#shadow)">
    <rect width="252" height="100" rx="16" class="card"/>
    <circle cx="25" cy="26" r="7" fill="#f1c88f"/>
    <text x="43" y="31" class="cardTitle">SIDE QUEST</text>
    <text x="20" y="59" class="cardText">Make a small experiment</text>
    <text x="20" y="79" class="cardText dim">FLOW · simulations · curiosity</text>
  </g>
</svg>
