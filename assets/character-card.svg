<svg fill="none" viewBox="0 0 850 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&amp;family=JetBrains+Mono:wght@600;800&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .stat-container {
          width: 100%;
          height: 200px;
          background: linear-gradient(135deg, rgba(16, 18, 30, 0.95), rgba(9, 10, 16, 0.95));
          border-radius: 20px;
          border: 1.5px solid rgba(0, 240, 255, 0.35);
          box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(255, 46, 147, 0.08);
          font-family: 'Outfit', sans-serif;
          padding: 20px 28px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }

        .ambient-light {
          position: absolute;
          width: 200px;
          height: 200px;
          background: radial-gradient(circle, rgba(255, 46, 147, 0.2) 0%, transparent 70%);
          right: -50px;
          top: -50px;
          filter: blur(30px);
        }

        .left-profile {
          display: flex;
          align-items: center;
          gap: 18px;
        }

        .avatar-ring {
          width: 76px;
          height: 76px;
          border-radius: 18px;
          background: linear-gradient(135deg, #ff2e93, #ff7a00, #00f0ff);
          padding: 3px;
          box-shadow: 0 0 18px rgba(255, 46, 147, 0.35);
        }

        .avatar-inner {
          width: 100%;
          height: 100%;
          background: #0d0f18;
          border-radius: 15px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 32px;
        }

        .player-info h3 {
          color: #fff;
          font-size: 19px;
          font-weight: 900;
          letter-spacing: -0.5px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .player-class {
          font-family: 'JetBrains Mono', monospace;
          color: #00f0ff;
          font-size: 11.5px;
          font-weight: 700;
          text-transform: uppercase;
          margin-top: 3px;
          letter-spacing: 0.5px;
        }

        .status-badge-inline {
          display: inline-block;
          margin-top: 8px;
          background: rgba(255, 46, 147, 0.12);
          border: 1px solid rgba(255, 46, 147, 0.35);
          color: #ff75ba;
          padding: 3px 10px;
          border-radius: 8px;
          font-size: 10.5px;
          font-weight: 700;
        }

        /* Stats Grid */
        .bars-side {
          display: flex;
          flex-direction: column;
          gap: 12px;
          width: 450px;
        }

        .stat-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }

        .stat-label {
          font-size: 12.5px;
          font-weight: 700;
          color: #b8c1ec;
          width: 175px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .bar-track {
          flex: 1;
          height: 8px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }

        .bar-fill {
          height: 100%;
          border-radius: 999px;
        }

        .fill-core {
          width: 75%;
          background: linear-gradient(90deg, #ff2e93, #ff7a00);
        }

        .fill-web {
          width: 70%;
          background: linear-gradient(90deg, #00f0ff, #7928ca);
        }

        .fill-db {
          width: 65%;
          background: linear-gradient(90deg, #ffe600, #ff7a00);
        }

        .fill-side {
          width: 50%;
          background: linear-gradient(90deg, #00ff88, #00f0ff);
        }

        .stat-val {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          color: #94a3b8;
          width: 80px;
          text-align: right;
        }
      </style>

      <div class="stat-container">
        <div class="ambient-light"></div>

        <div class="left-profile">
          <div class="avatar-ring">
            <div class="avatar-inner">🎓</div>
          </div>
          <div class="player-info">
            <h3>Sreejith S H <span style="color:#00ff88; font-size:11px; font-weight:700;">[VIT '29]</span></h3>
            <div class="player-class">🌐 Student &amp; Web Developer</div>
            <div class="status-badge-inline">⚓ Builder of SnapHarbor</div>
          </div>
        </div>

        <div class="bars-side">
          <div class="stat-row">
            <span class="stat-label">💻 Core (C, C++, Java)</span>
            <div class="bar-track"><div class="bar-fill fill-core"></div></div>
            <span class="stat-val">Learning</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">🌐 Web Dev &amp; Python</span>
            <div class="bar-track"><div class="bar-fill fill-web"></div></div>
            <span class="stat-val">Building</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">🗄️ MySQL &amp; Oracle SQL</span>
            <div class="bar-track"><div class="bar-fill fill-db"></div></div>
            <span class="stat-val">Practicing</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">🎮 Unity &amp; C# (Side Quest)</span>
            <div class="bar-track"><div class="bar-fill fill-side"></div></div>
            <span class="stat-val">Exploring</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
