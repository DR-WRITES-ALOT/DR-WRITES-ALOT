<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Sreejith SH — a dreamy developer profile</title>
  <desc id="desc">A moonlit storybook scene introducing Sreejith SH, a computer science student at VIT and aspiring web developer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132b"/>
      <stop offset="0.52" stop-color="#302044"/>
      <stop offset="1" stop-color="#5c385c"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4a7a5" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#f6d6b8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c89ad5" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2d7"/>
      <stop offset="1" stop-color="#edc9c2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1d7"/>
      <stop offset="1" stop-color="#ecc8c7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d6b8"/>
      <stop offset=".5" stop-color="#f4b6c2"/>
      <stop offset="1" stop-color="#d9b2ea"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090715" flood-opacity=".42"/>
    </filter>
    <clipPath id="frame"><rect x="2" y="2" width="896" height="376" rx="28"/></clipPath>
    <style>
      .eyebrow { fill: #f4cdd0; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.2px; }
      .title { fill: #fff1e0; font: 700 49px ui-rounded, "Trebuchet MS", sans-serif; letter-spacing: -1.6px; }
      .accent { fill: url(#ink); }
      .sub { fill: #f8e7dc; font: 400 18px ui-rounded, "Trebuchet MS", sans-serif; }
      .micro { fill: #f5d7d4; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .5px; }
      .pill { fill: #251a3b; stroke: #dba8c9; stroke-opacity: .5; }
      .pillText { fill: #f8e5d9; font: 600 12px ui-rounded, "Trebuchet MS", sans-serif; }
      .star { fill: #fff0ca; filter: url(#softGlow); transform-box: fill-box; transform-origin: center; animation: twinkle 3.8s ease-in-out infinite; }
      .star.alt { animation-delay: -1.7s; }
      .star.late { animation-delay: -3s; }
      .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.slow { animation-duration: 9s; animation-delay: -2s; }
      .reveal { animation: reveal 1.1s ease-out both; }
      .reveal.late { animation-delay: .22s; }
      .shimmer { stroke-dasharray: 10 18; animation: shimmer 8s linear infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.7); } 48% { opacity: 1; transform: scale(1.2); } 58% { opacity: .7; transform: scale(.95); } }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shimmer { to { stroke-dashoffset: -220; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="380" fill="url(#sky)"/>
    <circle cx="774" cy="92" r="116" fill="#c18bd1" opacity=".09" filter="url(#softGlow)"/>
    <circle cx="696" cy="322" r="170" fill="#e7a4ae" opacity=".08" filter="url(#softGlow)"/>
    <path d="M0 292 C150 252 260 307 385 279 C510 250 618 291 900 244 V380 H0Z" fill="#17132b" opacity=".62"/>
    <path d="M0 302 C170 266 260 322 402 293 C560 260 703 302 900 262" fill="none" stroke="url(#horizon)" stroke-width="2" class="shimmer"/>

    <g aria-hidden="true">
      <path d="M49 72 l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" class="star"/>
      <path d="M232 54 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" class="star alt"/>
      <path d="M356 105 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" class="star late"/>
      <path d="M544 53 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" class="star alt"/>
      <path d="M638 151 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" class="star"/>
      <path d="M849 196 l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" class="star late"/>
      <circle cx="115" cy="154" r="2.2" class="star late"/>
      <circle cx="470" cy="79" r="2.1" class="star"/>
      <circle cx="592" cy="211" r="2.4" class="star alt"/>
      <circle cx="820" cy="54" r="2" class="star"/>
    </g>

    <g class="float slow" aria-hidden="true">
      <circle cx="763" cy="105" r="57" fill="url(#moon)" filter="url(#softGlow)"/>
      <circle cx="788" cy="84" r="58" fill="#29203d"/>
      <circle cx="737" cy="125" r="7" fill="#d6adaf" opacity=".35"/>
      <circle cx="758" cy="84" r="4" fill="#d6adaf" opacity=".3"/>
      <path d="M700 171 q62 -24 126 0" fill="none" stroke="#f4d3d0" stroke-opacity=".35" stroke-width="2"/>
    </g>

    <g class="reveal" transform="translate(62 64)">
      <text x="0" y="0" class="eyebrow">A LITTLE CORNER OF THE INTERNET · CHAPTER 01</text>
      <text x="0" y="77" class="title">Hi, I’m <tspan class="accent">Sreejith</tspan>.</text>
      <text x="0" y="118" class="sub">CS student at VIT ’29 · aspiring web developer</text>
      <text x="0" y="151" class="sub">I turn curious ideas into useful little worlds.</text>

      <g transform="translate(0 181)">
        <rect width="153" height="29" rx="14.5" class="pill"/>
        <text x="76.5" y="19" text-anchor="middle" class="pillText">building with care</text>
        <rect x="164" width="156" height="29" rx="14.5" class="pill"/>
        <text x="242" y="19" text-anchor="middle" class="pillText">learning in public</text>
      </g>
    </g>

    <g class="float" transform="translate(625 242)" filter="url(#shadow)" aria-hidden="true">
      <path d="M0 31 Q71 4 143 31 V82 Q71 55 0 82Z" fill="#9b637f" stroke="#e9b3c5" stroke-width="2"/>
      <path d="M3 28 Q70 3 140 28 Q70 51 3 28Z" fill="url(#paper)" stroke="#f8dfce" stroke-width="2"/>
      <path d="M70 12 V51" stroke="#bd8398" stroke-width="2" opacity=".8"/>
      <path d="M15 30 Q41 22 64 29" fill="none" stroke="#c99aa2" stroke-width="1.6" opacity=".8"/>
      <path d="M77 29 Q102 21 128 30" fill="none" stroke="#c99aa2" stroke-width="1.6" opacity=".8"/>
      <path d="M20 39 Q45 32 62 37 M79 37 Q102 31 124 39" fill="none" stroke="#c99aa2" stroke-width="1.5" opacity=".6"/>
      <path d="M129 43 q21 6 26 -12" fill="none" stroke="#f3cfb9" stroke-width="2"/>
      <circle cx="156" cy="28" r="3" fill="#f6d6b8"/>
      <text x="70" y="71" text-anchor="middle" class="micro">MAKE · LEARN · REPEAT</text>
    </g>

    <text x="66" y="350" class="micro">SREEJITH SH / VIT ’29</text>
    <text x="835" y="350" text-anchor="end" class="micro">01 / 04</text>
    <rect x="2" y="2" width="896" height="376" rx="28" fill="none" stroke="#efc5cd" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
