<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Outfit:wght@500;700&amp;display=swap');
      
      .title { font-family: 'Fredoka', sans-serif; font-size: 18px; fill: #7A7A7A; font-weight: 600; }
      .value { font-family: 'Outfit', sans-serif; font-size: 42px; font-weight: 700; fill: #333333; }
      .sub { font-family: 'Fredoka', sans-serif; font-size: 14px; fill: #A0A0A0; font-weight: 500; }
      
      .float1 { animation: floatSlow 3s ease-in-out infinite alternate; }
      .float2 { animation: floatSlow 3s ease-in-out infinite alternate-reverse; animation-delay: -1.5s; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="896" height="246" rx="36" fill="#FDFBF7" stroke="#FFEBE6" stroke-width="4"/>

  <!-- Card 1: Current Focus -->
  <g transform="translate(70, 45)">
    <g class="float1">
      <rect width="360" height="160" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="40" height="40" rx="12" fill="#FF6B6B"/>
      <!-- Fallback font-family for emojis -->
      <text x="44" y="50" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="central">🔥</text>
      
      <!-- Texts -->
      <text x="76" y="50" class="title" dominant-baseline="central">Current Focus</text>
      <text x="24" y="105" class="value">Leveling Up</text>
      <text x="24" y="135" class="sub">Building cool sh*t daily</text>
    </g>
  </g>

  <!-- Card 2: Next Milestone -->
  <g transform="translate(470, 45)">
    <g class="float2">
      <rect width="360" height="160" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="40" height="40" rx="12" fill="#FFCE54"/>
      <text x="44" y="50" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="central">🌟</text>
      
      <!-- Texts -->
      <text x="76" y="50" class="title" dominant-baseline="central">Next Milestone</text>
      <text x="24" y="105" class="value">Mastering Unity</text>
      <text x="24" y="135" class="sub">Game mechanics &amp; physics</text>
    </g>
  </g>
</svg>
