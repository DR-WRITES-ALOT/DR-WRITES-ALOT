<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Outfit:wght@500;700&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .container {
          width: 100%;
          height: 250px;
          background: #FDFBF7;
          border-radius: 36px;
          border: 4px solid #FFEBE6;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 40px;
          font-family: 'Fredoka', sans-serif;
          position: relative;
        }

        .stat-card {
          flex: 1;
          max-width: 350px;
          height: 160px;
          background: #FFFFFF;
          border-radius: 28px;
          padding: 24px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          box-shadow: 
            0px 15px 30px rgba(0,0,0,0.06),
            inset 0px -6px 12px rgba(0,0,0,0.05);
          animation: floatSlow 3s ease-in-out infinite alternate;
        }
        
        .stat-card:nth-child(2) {
          animation-delay: -1.5s;
          animation-direction: alternate-reverse;
        }

        .header {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 12px;
        }
        
        .icon {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 20px;
          color: white;
        }
        .icon-fire { background: #FF6B6B; }
        .icon-star { background: #FFCE54; }

        .title {
          font-size: 18px;
          color: #7A7A7A;
          font-weight: 600;
        }

        .value {
          font-family: 'Outfit', sans-serif;
          font-size: 42px;
          font-weight: 700;
          color: #333333;
          margin-left: 52px;
        }
        
        .sub {
          font-size: 14px;
          color: #A0A0A0;
          margin-left: 52px;
          font-weight: 500;
        }

        @keyframes floatSlow {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-6px); }
        }
      </style>

      <div class="container">
        
        <!-- Activity Placeholder Card -->
        <div class="stat-card">
          <div class="header">
            <div class="icon icon-fire">🔥</div>
            <div class="title">Current Focus</div>
          </div>
          <div class="value">Leveling Up</div>
          <div class="sub">Building cool sh*t daily</div>
        </div>

        <!-- Rating/Rank Placeholder Card -->
        <div class="stat-card">
          <div class="header">
            <div class="icon icon-star">🌟</div>
            <div class="title">Next Milestone</div>
          </div>
          <div class="value">Mastering Unity</div>
          <div class="sub">Game mechanics & physics</div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
