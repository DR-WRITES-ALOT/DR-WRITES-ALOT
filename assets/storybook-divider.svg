<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="100%" height="44" role="img" aria-label="Animated constellation divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dca8d8" stop-opacity="0"/>
      <stop offset=".18" stop-color="#dca8d8" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#f6d6b8"/>
      <stop offset=".82" stop-color="#dca8d8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#dca8d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .trail { fill: none; stroke: url(#line); stroke-width: 1.5; stroke-dasharray: 7 14; animation: drift 9s linear infinite; filter: url(#glow); }
      .spark { fill: #f6d6b8; animation: blink 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spark.alt { animation-delay: -1.2s; }
      .spark.late { animation-delay: -2.2s; }
      @keyframes drift { to { stroke-dashoffset: -210; } }
      @keyframes blink { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <path d="M0 22 C150 8 245 36 360 22 S555 8 680 22 S805 36 900 22" class="trail"/>
  <path d="M0 22 C150 8 245 36 360 22 S555 8 680 22 S805 36 900 22" fill="none" stroke="#f6d6b8" stroke-opacity=".18"/>
  <path d="M450 13 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" class="spark"/>
  <circle cx="182" cy="18" r="2.2" class="spark alt"/>
  <circle cx="710" cy="28" r="2" class="spark late"/>
  <circle cx="80" cy="28" r="1.7" class="spark"/>
  <circle cx="823" cy="16" r="1.7" class="spark alt"/>
</svg>
