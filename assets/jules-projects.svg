<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Outfit:wght@500;700&amp;display=swap');
      
      .tag { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; fill: #4A90E2; }
      .tag-2 { fill: #FFB347; }
      
      .title { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 700; fill: #333333; }
      .desc { font-family: 'Fredoka', sans-serif; font-size: 15px; fill: #666666; }
      
      .mini-pill-text { font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 600; fill: #555555; }
      
      .float1 { animation: floatSlow 4s ease-in-out infinite alternate; }
      .float2 { animation: floatSlow 4s ease-in-out infinite alternate-reverse; animation-delay: -2s; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-10px) rotate(1deg); }
      }
    </style>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-opacity="0.06"/>
    </filter>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="tag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="346" rx="36" fill="#FDFBF7" stroke="#FFEBE6" stroke-width="4"/>

  <!-- Card 1: SnapHarbor -->
  <g transform="translate(45, 50)">
    <g class="float1">
      <rect width="390" height="250" rx="28" fill="#E8F4FF" stroke="#D4E9FF" stroke-width="2" filter="url(#card-shadow)"/>
      
      <!-- Header Icon -->
      <rect x="24" y="24" width="50" height="50" rx="16" fill="#4A90E2" filter="url(#icon-shadow)"/>
      <text x="49" y="52" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" dominant-baseline="central">⚓</text>
      
      <!-- Tag -->
      <g transform="translate(260, 30)">
        <rect width="105" height="28" rx="14" fill="#FFFFFF" filter="url(#tag-shadow)"/>
        <text x="52.5" y="14" class="tag" text-anchor="middle" dominant-baseline="central">Featured Lab</text>
      </g>

      <!-- Texts -->
      <text x="24" y="110" class="title">SnapHarbor</text>
      <text x="24" y="135" class="desc">A high-performance, local-first</text>
      <text x="24" y="155" class="desc">media vault with SHA-256 dedupe,</text>
      <text x="24" y="175" class="desc">timeline galleries, automation, &amp;</text>
      <text x="24" y="195" class="desc">modern glassmorphism aesthetics.</text>

      <!-- Footer Pills -->
      <g transform="translate(24, 212)">
        <rect width="85" height="24" rx="8" fill="rgba(255,255,255,0.7)"/>
        <text x="42.5" y="12" class="mini-pill-text" text-anchor="middle" dominant-baseline="central">Rust + Tauri</text>
      </g>
      <g transform="translate(117, 212)">
        <rect width="70" height="24" rx="8" fill="rgba(255,255,255,0.7)"/>
        <text x="35" y="12" class="mini-pill-text" text-anchor="middle" dominant-baseline="central">React 19</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Unity Sandbox -->
  <g transform="translate(465, 50)">
    <g class="float2">
      <rect width="390" height="250" rx="28" fill="#FFF0E8" stroke="#FFE0D4" stroke-width="2" filter="url(#card-shadow)"/>
      
      <!-- Header Icon -->
      <rect x="24" y="24" width="50" height="50" rx="16" fill="#FFB347" filter="url(#icon-shadow)"/>
      <text x="49" y="52" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" dominant-baseline="central">🎮</text>
      
      <!-- Tag -->
      <g transform="translate(280, 30)">
        <rect width="85" height="28" rx="14" fill="#FFFFFF" filter="url(#tag-shadow)"/>
        <text x="42.5" y="14" class="tag tag-2" text-anchor="middle" dominant-baseline="central">Side Quest</text>
      </g>

      <!-- Texts -->
      <text x="24" y="110" class="title">Unity Sandbox</text>
      <text x="24" y="140" class="desc">Bouncing around with physics,</text>
      <text x="24" y="160" class="desc">game loops, and C# mechanics</text>
      <text x="24" y="180" class="desc">just to see what happens!</text>

      <!-- Footer Pills -->
      <g transform="translate(24, 205)">
        <rect width="70" height="24" rx="8" fill="rgba(255,255,255,0.7)"/>
        <text x="35" y="12" class="mini-pill-text" text-anchor="middle" dominant-baseline="central">Unity 3D</text>
      </g>
      <g transform="translate(104, 205)">
        <rect width="75" height="24" rx="8" fill="rgba(255,255,255,0.7)"/>
        <text x="37.5" y="12" class="mini-pill-text" text-anchor="middle" dominant-baseline="central">C# Scripts</text>
      </g>
    </g>
  </g>
</svg>
