<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');
      
      .title { font-family: 'Fredoka', 'Outfit', sans-serif; font-size: 64px; font-weight: 700; fill: #333333; letter-spacing: -1.5px; }
      .title-name { fill: #FF6B6B; }
      
      .badge-text { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; fill: #4A90E2; }
      
      .desc { font-family: 'Outfit', sans-serif; font-size: 18px; fill: #7A7A7A; }
      .desc-bold { font-weight: 700; fill: #FF6B6B; }

      .anim-blob-1 { animation: floatSlow 10s ease-in-out infinite alternate; }
      .anim-blob-2 { animation: floatSlow 10s ease-in-out infinite alternate-reverse; animation-delay: -3s; }
      .anim-blob-3 { animation: floatSlow 10s ease-in-out infinite alternate; animation-delay: -6s; }

      .float-1 { animation: floatGentle 4s ease-in-out infinite alternate; }
      .float-2 { animation: floatGentle 4s ease-in-out infinite alternate-reverse; animation-delay: -1.5s; }
      .float-3 { animation: floatGentle 4s ease-in-out infinite alternate; animation-delay: -3s; }

      .bounce-title { animation: bounceIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }
      .bounce-title-2 { animation: bounceIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; animation-delay: 0.1s; opacity: 0; }
      .pop-badge { animation: popUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; animation-delay: 0.5s; opacity: 0; }
      .fade-desc { animation: fadeIn 1s ease-out forwards; animation-delay: 0.8s; opacity: 0; }

      @keyframes floatSlow {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, -30px) scale(1.1); }
      }
      @keyframes floatGentle {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-20px) rotate(5deg); }
      }
      @keyframes bounceIn {
        0% { opacity: 0; transform: translateY(40px) scale(0.9); }
        100% { opacity: 1; transform: translateY(0px) scale(1); }
      }
      @keyframes popUp {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
    
    <filter id="blur-blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4A90E2" flood-opacity="0.15"/>
    </filter>
    
    <filter id="float-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <clipPath id="clip">
      <rect x="2" y="2" width="896" height="396" rx="36"/>
    </clipPath>
    
    <rect x="2" y="2" width="896" height="396" rx="36" fill="#FDFBF7" stroke="#FFEBE6" stroke-width="4"/>

    <!-- Blobs -->
    <g transform="translate(50, 50)">
      <circle cx="0" cy="0" r="175" fill="#FFD4E5" class="anim-blob-1" filter="url(#blur-blob)" opacity="0.7"/>
    </g>
    <g transform="translate(850, 450)">
      <circle cx="0" cy="0" r="200" fill="#D4F0FF" class="anim-blob-2" filter="url(#blur-blob)" opacity="0.7"/>
    </g>
    <g transform="translate(650, 100)">
      <circle cx="0" cy="0" r="150" fill="#FFF4D4" class="anim-blob-3" filter="url(#blur-blob)" opacity="0.7"/>
    </g>

    <!-- Floating Icons -->
    <g transform="translate(100, 80) rotate(-15)">
      <g class="float-1">
        <rect x="-45" y="-45" width="90" height="90" rx="24" fill="#FFB347" filter="url(#float-shadow)"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" dominant-baseline="central">💻</text>
      </g>
    </g>

    <g transform="translate(750, 300) rotate(20)">
      <g class="float-2">
        <rect x="-50" y="-50" width="100" height="100" rx="24" fill="#4A90E2" filter="url(#float-shadow)"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" dominant-baseline="central">🎮</text>
      </g>
    </g>

    <g transform="translate(730, 80) rotate(10)">
      <g class="float-3">
        <rect x="-35" y="-35" width="70" height="70" rx="24" fill="#50E3C2" filter="url(#float-shadow)"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" dominant-baseline="central">⚓</text>
      </g>
    </g>

    <!-- Main Content -->
    <!-- Title -->
    <g transform="translate(450, 130)">
      <text text-anchor="middle" dominant-baseline="central" class="title">
        <tspan x="-120" class="bounce-title">Hi,</tspan>
        <tspan x="90" class="title-name bounce-title-2">I'm Sreejith!</tspan>
      </text>
    </g>

    <!-- Badge -->
    <g transform="translate(450, 210)">
      <!-- Badge container centered horizontally -->
      <g transform="translate(-160, -25)">
        <g class="pop-badge">
          <rect width="320" height="50" rx="25" fill="#FFFFFF" stroke="#E8F4FF" stroke-width="2" filter="url(#badge-shadow)"/>
          <rect x="10" y="10" width="30" height="30" rx="15" fill="#4A90E2"/>
          <text x="25" y="27" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="central">✌️</text>
          <text x="175" y="27" class="badge-text" text-anchor="middle" dominant-baseline="central">Student &amp; Web Developer</text>
        </g>
      </g>
    </g>

    <!-- Description -->
    <g transform="translate(450, 275)">
      <g class="fade-desc">
        <text x="0" y="0" class="desc" text-anchor="middle">
          B.Tech CSE student at <tspan class="desc-bold">VIT ('29)</tspan>. I love building playful web
        </text>
        <text x="0" y="25" class="desc" text-anchor="middle">
          experiences, mastering core algorithms, and tinkering
        </text>
        <text x="0" y="50" class="desc" text-anchor="middle">
          with game dev on the side! ✨
        </text>
      </g>
    </g>
  </g>
</svg>
