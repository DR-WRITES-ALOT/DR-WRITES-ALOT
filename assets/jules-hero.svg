<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .container {
          width: 100%;
          height: 400px;
          background: #FDFBF7; /* Soft creamy off-white */
          position: relative;
          overflow: hidden;
          font-family: 'Fredoka', 'Outfit', sans-serif;
          border-radius: 36px;
          border: 4px solid #FFEBE6;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: inset 0px -10px 20px rgba(0,0,0,0.02);
        }

        /* Soft Animated Background Blobs */
        .blob {
          position: absolute;
          border-radius: 50%;
          filter: blur(40px);
          opacity: 0.7;
          animation: floatSlow 10s ease-in-out infinite alternate;
        }
        .blob-1 { width: 350px; height: 350px; background: #FFD4E5; top: -50px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #D4F0FF; bottom: -100px; right: -50px; animation-delay: -3s; animation-direction: alternate-reverse; }
        .blob-3 { width: 300px; height: 300px; background: #FFF4D4; top: 20px; right: 250px; animation-delay: -6s; }

        .content {
          position: relative;
          z-index: 10;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }

        /* Bouncy Title */
        .title {
          font-size: 64px;
          font-weight: 700;
          color: #333333;
          letter-spacing: -1.5px;
          line-height: 1.1;
        }
        .title span {
          display: inline-block;
          animation: bounceIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
          opacity: 0;
          transform: translateY(40px);
        }
        .title span:nth-child(1) { animation-delay: 0.1s; }
        .title span:nth-child(2) { animation-delay: 0.2s; color: #FF6B6B; } /* "Sreejith" */
        
        /* Claymorphic Pill Badge */
        .badge {
          background: #FFFFFF;
          color: #4A90E2;
          font-size: 18px;
          font-weight: 600;
          padding: 12px 32px;
          border-radius: 999px;
          box-shadow: 
            0px 10px 20px rgba(74, 144, 226, 0.15),
            inset 0px -4px 8px rgba(0,0,0,0.05),
            inset 0px 4px 8px #FFFFFF;
          border: 2px solid #E8F4FF;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          opacity: 0;
          animation: popUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
          animation-delay: 0.5s;
        }

        .badge-icon {
          background: #4A90E2;
          color: #FFF;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 14px;
        }

        /* Description */
        .desc {
          font-family: 'Outfit', sans-serif;
          font-size: 18px;
          color: #7A7A7A;
          max-width: 550px;
          line-height: 1.5;
          opacity: 0;
          animation: fadeIn 1s ease-out forwards;
          animation-delay: 0.8s;
        }
        .desc strong {
          color: #FF6B6B;
          font-weight: 700;
        }

        /* Floating 3D Elements */
        .float-item {
          position: absolute;
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 48px;
          box-shadow: 
            0px 20px 40px rgba(0,0,0,0.1),
            inset 0px -6px 12px rgba(0,0,0,0.1),
            inset 0px 6px 12px rgba(255,255,255,0.6);
          animation: floatGentle 4s ease-in-out infinite alternate;
        }
        
        .float-1 {
          background: #FFB347; /* Orange */
          width: 90px; height: 90px;
          top: 50px; left: 80px;
          transform: rotate(-15deg);
          animation-delay: 0s;
        }
        
        .float-2 {
          background: #4A90E2; /* Blue */
          width: 100px; height: 100px;
          bottom: 60px; right: 90px;
          transform: rotate(20deg);
          animation-delay: -1.5s;
          animation-direction: alternate-reverse;
        }
        
        .float-3 {
          background: #50E3C2; /* Teal */
          width: 70px; height: 70px;
          top: 70px; right: 120px;
          transform: rotate(10deg);
          animation-delay: -3s;
          font-size: 36px;
        }

        /* Animations */
        @keyframes floatSlow {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(30px, -30px) scale(1.1); }
        }

        @keyframes floatGentle {
          0% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
          100% { transform: translateY(-20px) rotate(var(--rot, 5deg)); }
        }

        @keyframes bounceIn {
          0% { opacity: 0; transform: translateY(40px) scale(0.9); }
          100% { opacity: 1; transform: translateY(0px) scale(1); }
        }

        @keyframes popUp {
          0% { opacity: 0; transform: scale(0.5); }
          100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }
      </style>

      <div class="container">
        <!-- Blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <!-- Floating Objects -->
        <div class="float-item float-1" style="--rot: -15deg">💻</div>
        <div class="float-item float-2" style="--rot: 20deg">🎮</div>
        <div class="float-item float-3" style="--rot: 10deg">⚓</div>

        <!-- Main Content -->
        <div class="content">
          <h1 class="title">
            <span>Hi,</span> <span>I'm Sreejith!</span>
          </h1>
          
          <div class="badge">
            <div class="badge-icon">✌️</div>
            Student &amp; Web Developer
          </div>
          
          <p class="desc">
            B.Tech CSE student at <strong>VIT ('29)</strong>. I love building playful web experiences, mastering core algorithms, and tinkering with game dev on the side! ✨
          </p>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
