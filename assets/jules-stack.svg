<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Outfit:wght@600;700&amp;display=swap');
      
      .title-text { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; fill: #333333; }
      .pill-text { font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
      .pill-icon { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; }
      .pill-python-text { fill: #8A6D3B; }
      .emoji { font-family: Arial, sans-serif; font-size: 16px; }
      
      .bounce0 { animation: bouncyFloat 3s ease-in-out infinite alternate; }
      .bounce1 { animation: bouncyFloat 3s ease-in-out infinite alternate; animation-delay: 0.2s; }
      .bounce2 { animation: bouncyFloat 3s ease-in-out infinite alternate; animation-delay: 0.4s; }
      .bounce3 { animation: bouncyFloat 3s ease-in-out infinite alternate; animation-delay: 0.6s; }
      .bounce4 { animation: bouncyFloat 3s ease-in-out infinite alternate; animation-delay: 0.8s; }
      
      @keyframes bouncyFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
    <filter id="pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="title-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="896" height="246" rx="36" fill="#FDFBF7" stroke="#FFEBE6" stroke-width="4"/>
  
  <!-- Decor circles -->
  <circle cx="100" cy="20" r="50" fill="#F0F0F0"/>
  <circle cx="820" cy="220" r="75" fill="#F0F0F0"/>
  <circle cx="700" cy="110" r="30" fill="#F0F0F0"/>

  <!-- Title Badge -->
  <g transform="translate(320, 20)">
    <rect width="260" height="46" rx="20" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="2" filter="url(#title-shadow)"/>
    <text x="130" y="28" class="title-text" text-anchor="middle" dominant-baseline="central">🛠️ My Toybox (Tech Stack)</text>
  </g>

  <!-- Row 1 -->
  <!-- C -->
  <g transform="translate(140, 100)">
    <g class="bounce0">
      <rect width="100" height="44" rx="22" fill="#5D9CEC" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="pill-icon" text-anchor="middle" dominant-baseline="central">C</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">C</text>
    </g>
  </g>

  <!-- C++ -->
  <g transform="translate(260, 100)">
    <g class="bounce1">
      <rect width="115" height="44" rx="22" fill="#4A90E2" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="pill-icon" text-anchor="middle" dominant-baseline="central">++</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">C++</text>
    </g>
  </g>

  <!-- Python -->
  <g transform="translate(395, 100)">
    <g class="bounce2">
      <rect width="135" height="44" rx="22" fill="#FFCE54" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">🐍</text>
      <text x="50" y="22" class="pill-text pill-python-text" dominant-baseline="central">Python</text>
    </g>
  </g>

  <!-- Java -->
  <g transform="translate(550, 100)">
    <g class="bounce3">
      <rect width="115" height="44" rx="22" fill="#ED5565" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">☕</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">Java</text>
    </g>
  </g>

  <!-- C# -->
  <g transform="translate(685, 100)">
    <g class="bounce4">
      <rect width="105" height="44" rx="22" fill="#AC92EC" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="pill-icon" text-anchor="middle" dominant-baseline="central">#</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">C#</text>
    </g>
  </g>

  <!-- Row 2 -->
  <!-- Web Basics -->
  <g transform="translate(190, 160)">
    <g class="bounce2">
      <rect width="160" height="44" rx="22" fill="#FC6E51" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">🌐</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">Web Basics</text>
    </g>
  </g>

  <!-- SQL -->
  <g transform="translate(370, 160)">
    <g class="bounce3">
      <rect width="105" height="44" rx="22" fill="#4FC1E9" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">🗄️</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">SQL</text>
    </g>
  </g>

  <!-- Unity -->
  <g transform="translate(495, 160)">
    <g class="bounce4">
      <rect width="120" height="44" rx="22" fill="#656D78" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">🎮</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">Unity</text>
    </g>
  </g>

  <!-- Git -->
  <g transform="translate(635, 160)">
    <g class="bounce0">
      <rect width="100" height="44" rx="22" fill="#EC87C0" filter="url(#pill-shadow)"/>
      <circle cx="26" cy="22" r="15" fill="rgba(255,255,255,0.25)"/>
      <text x="26" y="22" class="emoji" text-anchor="middle" dominant-baseline="central">🐙</text>
      <text x="50" y="22" class="pill-text" dominant-baseline="central">Git</text>
    </g>
  </g>
</svg>
