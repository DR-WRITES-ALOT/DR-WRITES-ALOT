<svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="SnapHarbor — a local-first photo and video vault with smart deduplication and automation">
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a22"/><stop offset=".58" stop-color="#211842"/><stop offset="1" stop-color="#4d2859"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302866" stop-opacity=".9"/><stop offset="1" stop-color="#1a153b" stop-opacity=".9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf"/><stop offset="1" stop-color="#ffd69a"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4a9c5"/><stop offset="1" stop-color="#c7a7ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .twinkle { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.alt { animation-delay: -1.4s; }
    .twinkle.late { animation-delay: -2.7s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float.alt { animation-delay: -2.3s; }
    .float.late { animation-delay: -4.1s; }
    .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: 700px 176px; }
    .orbit.slow { animation-duration: 28s; animation-direction: reverse; }
    .reveal { animation: reveal 1.1s ease-out both; }
    .reveal.late { animation-delay: .22s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.alt { animation-delay: -1.6s; }
    @keyframes twinkle { 0%,100% { opacity:.28; transform:scale(.7); } 48% { opacity:1; transform:scale(1.22); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</defs>
  <rect x="2" y="2" width="896" height="192" rx="24" fill="url(#glass)" stroke="#514375" stroke-width="2"/>
  <path d="M3 34 Q180 2 360 28 T710 20 T897 30 V3 H3Z" fill="#f4a9c5" opacity=".06"/>
  <circle cx="87" cy="98" r="58" fill="#f4a9c5" fill-opacity=".07" stroke="#f4a9c5" stroke-opacity=".38" stroke-width="1.5"/>
  <circle cx="87" cy="98" r="70" fill="none" stroke="#f4a9c5" stroke-opacity=".18" stroke-dasharray="2 10" class="orbit"/>
  <g fill="none" stroke="#f4a9c5" stroke-width="3" opacity=".25" filter="url(#blur)"><path d="M450 54v54M426 77h48M411 111c8 28 24 42 39 42s31-14 39-42M410 111h-24M474 111h24" fill="none" stroke="#f4a9c5" stroke-width="4" stroke-linecap="round"/><circle cx="450" cy="48" r="8" fill="none" stroke="#f4a9c5" stroke-width="4"/></g>
  <g fill="none" stroke="#f4a9c5" stroke-width="3"><path d="M450 54v54M426 77h48M411 111c8 28 24 42 39 42s31-14 39-42M410 111h-24M474 111h24" fill="none" stroke="#f4a9c5" stroke-width="4" stroke-linecap="round"/><circle cx="450" cy="48" r="8" fill="none" stroke="#f4a9c5" stroke-width="4"/></g>
  <text x="34" y="38" fill="#f4a9c5" font-size="11" font-weight="700" letter-spacing="2" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">01 / DESKTOP TOOL</text>
  <text x="190" y="57" fill="#f6f1ff" font-size="27" font-weight="700" font-family="Georgia,'Times New Roman',serif">SnapHarbor</text>
  <text x="190" y="82" fill="#b7acce" font-size="12" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">github.com/DR-WRITES-ALOT/SnapHarbor</text>
  <text x="190" y="111" fill="#f6f1ff" font-size="14" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">A local-first media vault for photos and video,</text>
  <text x="190" y="131" fill="#f6f1ff" font-size="14" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">with SHA-256 dedupe, device sync, and calm automation.</text>
  <rect x="190.0" y="151" width="69.7" height="22" rx="11" fill="#a9ddff" fill-opacity=".08" stroke="#a9ddff" stroke-opacity=".45"/><text x="224.8" y="166" text-anchor="middle" fill="#a9ddff" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">0 stars</text><rect x="267.7" y="151" width="91.0" height="22" rx="11" fill="#a9f3d4" fill-opacity=".08" stroke="#a9f3d4" stroke-opacity=".45"/><text x="313.2" y="166" text-anchor="middle" fill="#a9f3d4" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">TypeScript</text><rect x="366.7" y="151" width="105.2" height="22" rx="11" fill="#c7a7ff" fill-opacity=".08" stroke="#c7a7ff" stroke-opacity=".45"/><text x="419.3" y="166" text-anchor="middle" fill="#c7a7ff" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">Rust + Tauri</text><rect x="479.9" y="151" width="62.6" height="22" rx="11" fill="#ffd69a" fill-opacity=".08" stroke="#ffd69a" stroke-opacity=".45"/><text x="511.2" y="166" text-anchor="middle" fill="#ffd69a" font-size="11" font-family="'Avenir Next','Segoe UI',Arial,sans-serif">SQLite</text>
  <text x="860" y="38" text-anchor="end" fill="#f4a9c5" font-size="10" font-weight="700" letter-spacing="1.5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace">LOCAL-FIRST / V1</text>
  <circle cx="838" cy="165" r="3" fill="#ffd69a" class="twinkle"/><circle cx="855" cy="153" r="2" fill="#a9ddff" class="twinkle alt"/>
</svg>
