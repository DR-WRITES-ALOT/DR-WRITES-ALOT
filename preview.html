    img { display: block; max-width: 100%; height: auto; }
    .wide { width: 100%; }
    .button { display: inline-block; vertical-align: middle; margin: 4px; }
    @media (max-width: 700px) { body { padding: 8px 5px 40px; } main { padding: 8px; border-radius: 20px; } }
