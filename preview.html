<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sreejith SH · Profile console preview</title>
  <style>
    :root { color-scheme: dark; --bg: #070b17; --panel: #0e1427; --line: #273552; --text: #edf2ff; --muted: #71809e; --mint: #8cf7d6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 16px 72px; color: var(--text); background: radial-gradient(circle at 20% 0%, #25204a 0, transparent 32rem), radial-gradient(circle at 90% 15%, #18334a 0, transparent 28rem), var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    main { width: min(100%, 920px); margin: auto; padding: 20px; background: rgba(14, 20, 39, .88); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 100px rgba(0,0,0,.42); }
    img { display: block; max-width: 100%; height: auto; }
    .wide { width: 100%; }
    .small { width: min(100%, 860px); margin: 0 auto; }
    .hero { width: 100%; }
    .tagline { margin: 14px 0 26px; text-align: center; color: var(--muted); font-size: 13px; }
    code { color: var(--mint); }
    .split { display: flex; align-items: flex-start; justify-content: center; gap: 6px; }
    .split img { width: 50%; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 22px 0; }
    .links a { padding: 9px 13px; color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 5px; background: #141d35; font-size: 12px; }
    .links a:hover { border-color: var(--mint); color: var(--mint); }
    .note { margin: 20px auto 0; max-width: 760px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; }
    @media (max-width: 700px) { body { padding: 8px 5px 40px; } main { padding: 8px; } .split { flex-direction: column; gap: 12px; } .split img { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <img class="hero" src="./assets/hero.svg" alt="Dreamy terminal hero" />
    <p class="tagline"><code>builds useful things</code> · <code>learns in public</code> · <code>keeps a side quest open</code></p>
    <img class="wide" src="./assets/banner_work.svg" alt="Selected work" />
    <a href="https://github.com/DR-WRITES-ALOT/SnapHarbor"><img class="wide" src="./assets/card_snapharbor.svg" alt="SnapHarbor" /></a>
    <a href="https://github.com/DR-WRITES-ALOT/FLOW"><img class="wide" src="./assets/card_flow.svg" alt="FLOW" /></a>
    <a href="https://github.com/DR-WRITES-ALOT/rapid-response-dronemapper"><img class="wide" src="./assets/card_drone_mapper.svg" alt="Rapid Response Drone Mapper" /></a>
    <img class="wide" src="./assets/divider.svg" alt="" />
    <img class="wide" src="./assets/banner_telemetry.svg" alt="Telemetry" />
    <div class="split"><img src="./assets/stats.svg" alt="Live stats" /><img src="./assets/ops.svg" alt="Recent activity" /></div>
    <img class="small" src="./assets/contrib.svg" alt="Contribution scan" />
    <img class="wide" src="./assets/divider.svg" alt="" />
    <img class="wide" src="./assets/banner_stack.svg" alt="Loadout" />
    <img class="wide" src="./assets/stack.svg" alt="Technology stack" />
    <img class="wide" src="./assets/divider.svg" alt="" />
    <img class="wide" src="./assets/banner_contact.svg" alt="Contact" />
    <img class="wide" src="./assets/contact.svg" alt="Contact console" />
    <div class="links"><a href="https://github.com/DR-WRITES-ALOT">GitHub</a><a href="https://www.linkedin.com/in/sreejith-s-h-810803243/">LinkedIn</a><a href="https://github.com/DR-WRITES-ALOT?tab=repositories">Repositories</a></div>
    <p class="note">This local preview uses the same generated assets as the GitHub profile README. The panels are rebuilt from public GitHub data by the profile workflow.</p>
  </main>
</body>
</html>
